/* Login: opção B do design system Renova (branco, cinzas de texto, cantos retos, sem sombra). Página pública, ver functions/_middleware.js. */
:root {
  --surface: #FFFFFF;
  --carbon: #171A20;
  --graphite: #393C41;
  --pewter: #5C5E62;
  --f: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; background: var(--surface); color: var(--carbon); font-family: var(--f); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--carbon); outline-offset: 3px; }
header { height: 56px; box-sizing: border-box; padding: 0 48px; display: flex; align-items: center; justify-content: space-between; }
.logo { height: 22px; width: auto; display: block; }
header a { font-size: 14px; font-weight: 500; color: var(--pewter); text-decoration: none; padding: 12px 16px; border-radius: 4px; transition: color .33s; }
header a:hover { color: var(--carbon); }
main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 112px 16px 48px; text-align: center; }
h1 { margin: 0; font-size: 40px; line-height: 48px; font-weight: 500; }
.lede { margin: 16px 0 0; font-size: 17px; line-height: 26px; color: var(--graphite); }
.gbtn { margin-top: 40px; min-height: 44px; display: flex; justify-content: center; }
.gbtn:empty { display: none; }
.btn { margin-top: 40px; height: 44px; min-width: 240px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 12px; padding: 0 12px; background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 4px; font: 500 14px Arial, sans-serif; color: #3C4043; cursor: pointer; transition: background .33s; }
.btn:hover { background: #F8F9FA; }
.btn:disabled { opacity: .5; cursor: default; }
.btn svg { width: 18px; height: 18px; }
.btn span { flex: 1; text-align: center; }
.gbtn:not(:empty) + .btn { display: none; }
.nota { margin: 12px 0 0; font-size: 14px; line-height: 20px; color: var(--pewter); }
.erro { margin: 16px 0 0; font-size: 14px; line-height: 20px; font-weight: 500; color: #B3261E; }
[hidden] { display: none !important; }
.coluna { margin-top: 56px; width: min(1120px, 100%); height: auto; display: block; }
@media (max-width: 700px) {
  header { padding: 0 16px; }
  .logo { height: 18px; }
  header a { padding: 12px 8px; }
  main { padding-top: 96px; }
  h1 { font-size: 28px; line-height: 34px; }
  .lede { font-size: 16px; line-height: 24px; }
  .btn { width: 100%; }
  .coluna { margin-top: 72px; }
}
</style>

<script>
/* ================= Sessão (Supabase) ================= */
// functions/_middleware.js só libera o site com o token de acesso no cookie sb; aqui o cookie acompanha a sessão, inclusive na renovação.
// Nas páginas com #conta (aula e hub) mostra o primeiro nome e liga o Sair.
// Sem o supabase-js (CDN fora do ar) SB fica null e a aula segue só com o localStorage.
var SB = null;
try {
  SB = supabase.createClient('https://ugvqhjyeekyufxuyvozc.supabase.co', 'sb_publishable_FbgScRDcBuqkEt77OKKnpQ_Rb_K07Xq');
  SB.auth.onAuthStateChange((ev, s) => {
    document.cookie = 'sb=' + (s ? s.access_token + '; Max-Age=' + Math.max(0, s.expires_at - Math.floor(Date.now() / 1000)) : '; Max-Age=0') + '; Path=/; SameSite=Lax; Secure';
    const conta = document.getElementById('conta');
    if (!s || !conta) return;
    const m = s.user.user_metadata || {}, quem = document.getElementById('quem');
    quem.textContent = String(m.full_name || m.name || '').split(' ')[0] || s.user.email; quem.title = s.user.email || '';
    conta.hidden = false;
    document.getElementById('sair').onclick = () => SB.auth.signOut({ scope: 'local' }).finally(() => location.replace('/entrar'));
  });
} catch (e) { SB = null; }
</script>
<script>
/* ================= Login ================= */
(function () {
  const btn = document.getElementById('google'), erro = document.getElementById('erro');
  const falha = t => { erro.textContent = t; erro.hidden = false; };
  // o Supabase volta para esta página com os tokens no hash ou com error/error_description (e-mail fora dos domínios do grupo é recusado no cadastro)
  const p = new URLSearchParams(location.search.slice(1) + '&' + location.hash.slice(1));
  // volta: a página que o middleware recusou; fica na aba para sobreviver à ida ao Google
  const volta = p.get('volta'), guarda = (k, v) => { try { v === null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) { } };
  if (volta) guarda('volta', volta);
  // o Supabase não repassa o texto do gatilho checar_dominio ("Cadastro só com e-mail das empresas do grupo."): devolve o genérico
  // "Database error saving new user"; como o único gatilho em auth.users é o de domínio, os dois textos valem como recusa de domínio
  const codigo = p.get('error_code') || p.get('error');
  if (codigo || p.get('error_description')) falha(
    /Cadastro só com e-mail|Database error saving new user/i.test(p.get('error_description') || '') ? 'Use o e-mail de uma das empresas do grupo.'
      : p.get('error') === 'access_denied' ? 'Login cancelado.'
      : 'Não foi possível entrar. Código: ' + (codigo || 'desconhecido') + '.');
  if (!SB) { falha('Sem conexão com o serviço de login. Tente de novo em instantes.'); btn.disabled = true; return; }
  btn.onclick = () => { guarda('entrou', null); SB.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + '/entrar' } }); };
  /* botão do Google na própria página: o Google mostra o endereço do site, não o do Supabase, e o Supabase só recebe o token.
     Se o script do Google não carregar, fica o botão acima (fluxo por redirecionamento). */
  window.onGoogleLibraryLoad = async () => {
    if (!crypto.subtle) return; // fora de https (testes locais) fica o botão por redirecionamento
    const cru = [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('');
    const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(cru));
    google.accounts.id.initialize({
      client_id: '921714836663-pbtkcien4pdpcqqj4dfsiv1ntm6k5cah.apps.googleusercontent.com',
      nonce: [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''),
      callback: async r => {
        guarda('entrou', null); erro.hidden = true;
        const { error } = await SB.auth.signInWithIdToken({ provider: 'google', token: r.credential, nonce: cru });
        if (error) falha(/Cadastro só com e-mail|Database error saving new user/i.test(error.message) ? 'Use o e-mail de uma das empresas do grupo.'
          : 'Não foi possível entrar. Código: ' + (error.code || error.status || 'desconhecido') + '.');
      }
    });
    google.accounts.id.renderButton(document.getElementById('gbtn'), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'rectangular', locale: 'pt-BR', width: 240 });
  };
  if (!erro.hidden) return; // com erro na URL fica aqui, mesmo que reste uma sessão antiga
  SB.auth.onAuthStateChange((ev, s) => {
    if (!s) return;
    let v = '/', t = 0;
    try { v = sessionStorage.getItem('volta') || '/'; t = +sessionStorage.getItem('entrou') || 0; } catch (e) { }
    // trava contra laço: se o servidor recusar o token recém-entregue, o middleware devolve para cá em segundos e a página fica parada
    if (Date.now() - t < 10000) return;
    guarda('entrou', Date.now()); guarda('volta', null);
    location.replace(/^\/(?![\/\\]|entrar)/.test(v) ? v : '/'); // só caminhos do próprio site
  });
})();
</script>
