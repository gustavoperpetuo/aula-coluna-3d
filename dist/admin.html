    mods: { disc: { 'L4-L5': { discectomy: true } }, cage: { at: 'L4-L5', side: 'L' }, screws: ['L4.L', 'L4.R', 'L5.L', 'L5.R'], facetectomy: ['L4-L5.L'] },
    cam: { t: 'cage', az: 115, el: 22, d: 30 }, show: 'bone disc', ghost: true, ax: 'L4-L5', focus: ['L3', 'L4', 'L5', 'S'], hot: [],
    labels: [['cage', 'Cage no espaço discal'], ['screw.L4.L', 'Parafuso pedicular de L4'], ['screw.L5.L', 'Parafuso pedicular de L5'], ['rod.L', 'Haste'], ['fxt.L4-L5.L', 'Faceta retirada (acesso)']],
    regiao: 'Lombar, mais em L4-L5 e L5-S1, com cage no disco do segmento instável, por facetectomia de um lado, e parafusos pediculares.', nao: 'Estenose com listese de baixo grau sem instabilidade: a descompressão isolada não foi inferior à fusão (Austevoll, NEJM 2021). Dor lombar pura por discopatia só em casos muito selecionados.',
    ind: 'Espondilolistese degenerativa ou ístmica com instabilidade dinâmica e dor radicular ou claudicação, estenose cuja descompressão desestabiliza o segmento, recidiva de hérnia no mesmo nível e, em casos muito selecionados, discopatia com dor lombar. A fusão intersomática soma à descompressão a restauração da altura do disco e do forame e o apoio da coluna anterior.',
    alvo: 'O espaço discal do segmento instável, por exemplo L4-L5, acessado no triângulo entre a raiz que sai (L4), a raiz que desce (L5) e o saco dural. A coluna anterior carrega a maior parte da carga axial, por isso o cage com enxerto no disco consolida sob compressão e devolve altura ao forame, descomprimindo a raiz de forma indireta.',
    tec: 'Decúbito ventral, acesso posterior mediano ou paramediano minimamente invasivo, com parafusos pediculares guiados por radioscopia ou navegação por TC. No TLIF retira-se toda a faceta de um lado e o disco é abordado pelo forame, lateral ao saco dural, quase sem retraí-lo; No PLIF a laminectomia é bilateral e o disco é abordado dos dois lados do canal, afastando a dura e a raiz para a linha média. Após discectomia e preparo das placas terminais, o cage é colocado sob radioscopia em AP e perfil e as hastes comprimem o segmento sobre ele.',
    inj: 'Cage de PEEK ou titânio cheio de enxerto ósseo autólogo, em geral o osso local da laminectomia e da faceta, às vezes crista ilíaca ou substitutos, mais parafusos pediculares em cada vértebra ligados por duas hastes. No PLIF costumam ser dois cages, um de cada lado; No TLIF, um cage oblíquo ou curvo levado à parte anterior do disco.',
    risco: 'Numa meta-análise de espondilolistese, as complicações somaram 8,7% no TLIF e 17,0% no PLIF (de Kunder, Spine J 2017), e o TLIF teve menos lesão de raiz e menos rotura dural (Lan, World Neurosurg 2018). Outros riscos são parafuso mal posicionado, infecção, migração do cage e pseudoartrose. A doença do segmento adjacente que exigiu nova cirurgia chegou a 16,5% em 5 anos e 36,1% em 10 anos após artrodese posterior (Ghiselli, JBJS 2004).',
    evid: 'No SLIP, em listese degenerativa grau I, somar fusão posterolateral instrumentada à laminectomia deu 5,7 pontos a mais no SF-36 físico em 2 anos, sem diferença no ODI, e menos reoperação (14% contra 34%) (Ghogawala, NEJM 2016). No estudo sueco, com 247 pacientes com estenose, pouco mais da metade com listese, a fusão não melhorou o ODI em 2 e 5 anos, alongou a internação (7,4 contra 4,1 dias) e não reduziu reoperação (22% contra 21%) (Försth, NEJM 2016). TLIF e PLIF têm taxa de fusão e satisfação semelhantes (Lan, World Neurosurg 2018); Nenhum dos dois ensaios grandes testou o cage, e sim a fusão em si.',
    pro: 'No TLIF, a facetectomia completa de um lado expõe o triângulo entre a raiz que sai, a que desce e a dura, por onde se entra no disco sem afastar o saco. Cage bem anterior e compressão das hastes sobre ele ajudam a recuperar a lordose do segmento.'
  },
  {

    cam: { t: 'adr', az: 90, el: 4, d: 11 }, show: 'bone disc neuro', clip: 'sag', focus: ['C4', 'C5', 'C6', 'C7'], hot: [],
    labels: [['adr.core', 'Núcleo de polietileno'], ['adr.plate', 'Placas metálicas'], ['adr.keel', 'Quilha no corpo de C5'], ['adr.ann', 'Anel posterior que restou'], ['cord', 'Medula']],
    regiao: 'Cervical subaxial, mais em C5-C6 e C6-C7, por via anterior; A prótese discal lombar existe, mas é bem menos usada.', nao: 'Instabilidade, cifose fixa, artrose facetária, osteoporose grave, ossificação do ligamento longitudinal posterior ou compressão posterior: a escolha é a artrodese anterior (ACDF) ou a via posterior.',
    ind: 'Radiculopatia ou mielopatia cervical por hérnia de disco ou osteófito discal em 1 ou 2 níveis, aqui C5-C6, que não cedeu com tratamento conservador ou tem déficit progressivo. O segmento precisa ter movimento, sem instabilidade, sem cifose fixa e sem artrose facetária importante, e ficam de fora osteoporose grave, ossificação do ligamento longitudinal posterior e compressão que vem de trás.',
    alvo: 'O disco C5-C6 inteiro, retirado pela frente, com descompressão da medula e das raízes C6 nos dois forames. Em vez de fundir o segmento como na artrodese (ACDF), a prótese ocupa o espaço do disco e mantém o movimento, com a hipótese de poupar os discos vizinhos da sobrecarga.',
    tec: 'Decúbito dorsal com o pescoço em posição neutra e via anterior de Smith-Robinson: incisão transversa e plano entre a bainha carotídea, lateral, e traqueia e esôfago, mediais, até a coluna, com afastamento do longo do pescoço. Com distração do espaço, faz-se a discectomia completa, a retirada do ligamento longitudinal posterior e dos osteófitos e a foraminotomia dos dois lados; As placas terminais são preparadas sem retirar o osso cortical, e a prótese é escolhida para cobrir a maior área da placa e centrada na linha média sob radioscopia em AP e perfil.',

/* ================= Painel do administrador ================= */
// public.painel_admin() recusa quem não está em public.admins ('Acesso restrito.'); a página só mostra o que vier.
// Totais e teste final com as mesmas listas e contas da aula (src/app.js: progress() e bindQuiz()).
(function () {
  const $ = id => document.getElementById(id), estado = $('estado');
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const quando = t => t ? new Date(t).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo', dateStyle: 'short', timeStyle: 'short' }) : '';
  const visto = (lista, total) => `${Array.isArray(lista) ? lista.length : 0} de ${total}`;
  // como bindQuiz() mostra "X de N certas, faltam Y" para o teste final (store.quiz.dz)
  const teste = a => {
    const s = a || {}, n = Object.keys(s).length, ok = Object.entries(s).filter(([i, o]) => DZ_QUIZ[i] && DZ_QUIZ[i][2] === o).length;
    return n ? `${ok} de ${DZ_QUIZ.length} certas` + (n < DZ_QUIZ.length ? `, faltam ${DZ_QUIZ.length - n}` : '') : 'Não fez';
  };
  const RM_N = RM_CASES.reduce((n, c) => n + c.steps.length, 0); // passos de ressonância, como RM_STEPS em src/app.js
  const falha = html => { estado.innerHTML = html; };
  if (!SB) return falha('Não foi possível carregar os dados. Recarregue a página.');
  SB.rpc('painel_admin').then(({ data, error }) => {
    if (error) return falha(error.message === 'Acesso restrito.' ? 'Página restrita ao administrador. <a href="/">Voltar ao início</a>' : 'Não foi possível carregar os dados. Recarregue a página.');
    const L = data || [], semana = Date.now() - 7 * 864e5;
    // ativa: entrou ou mexeu no progresso nos últimos 7 dias (o último acesso do Supabase só muda a cada login)
    $('r-pessoas').textContent = L.length;
    $('r-ativas').textContent = L.filter(r => Math.max(Date.parse(r.ultimo_acesso) || 0, Date.parse(r.progresso_em) || 0) > semana).length;
    $('r-hoje').textContent = L.reduce((t, r) => t + (r.perguntas_hoje || 0), 0);
    $('linhas').innerHTML = L.map(r => {
      const p = r.progresso || {}, email = r.email || '';
      return `<tr><th scope="row">${esc(r.nome || email)}${r.nome ? `<span>${esc(email)}</span>` : ''}</th><td>${esc(email.split('@')[1])}</td>`
        + `<td class="w">${quando(r.primeiro_acesso)}</td><td class="w">${quando(r.ultimo_acesso)}</td>`
        + `<td>${visto(p.seen, ALL_STEPS.length)}</td><td>${visto(p.dzSeen, DZ.length)}</td><td>${visto(p.procSeen, PROC.length)}</td><td>${visto(p.rmSeen, RM_N)}</td>`
        + `<td class="w">${teste((p.quiz || {}).dz)}</td><td>${r.perguntas_total || 0}</td><td>${r.perguntas_hoje || 0}</td>`
        + `<td>${((r.voz_segundos_total || 0) / 60).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 })} min</td></tr>`;
    }).join('');
    estado.textContent = L.length ? 'Quem entrou no Atlas da Coluna e o que cada pessoa já viu.' : 'Ninguém entrou ainda.';
    $('resumo').hidden = false; $('tabela').hidden = !L.length;
  });
})();
</script>
