      contrast: [{ at: 'C6.at.R.ant', r: 0.24, key: 'contrast.tip', level: 'C6' }, { path: [['C6', -1.45, 0.5, 0.45], ['C6', -1.6, -0.1, 0.38], ['C7', -1.5, 0, 0.32], ['C7', -1.6, -1.05, 0.14], ['T1', -1.45, -0.3, 0.0]], r: 0.3, flat: 0.5, key: 'contrast.lc', level: 'C7' }] },
    cam: { t: 'C6.at.R', az: -62, el: 12, d: 15 }, show: 'bone neuro vessel rib', hide: ['cca.L', 'sca.L', 'va.L', 'bct', 'aorta', 'basilar', 'eia', 'iia', 'cia', 'ivc', 'azygos', 'hemiaz', 'plex', 'bvv', 'seg.', 'asa', 'psa', 'adamk'], focus: ['C4', 'C5', 'C6', 'C7', 'T1', 'T2'], hot: [],
    labels: [['stellate.R', 'Gânglio estrelado'], ['C6.at.R', 'Tubérculo de Chassaignac (C6)'], ['needle', 'Ponta no tubérculo de C6'], ['contrast.lc', 'Contraste no longo do pescoço'], ['va.V1.R', 'Artéria vertebral'], ['symp.R', 'Cadeia simpática cervical']],
    regiao: 'Cervical baixa, no tubérculo anterior de C6 ou junto ao transverso de C7, de um lado só, o do membro afetado.', nao: 'Dor simpática ou isquêmica da perna: o alvo é a cadeia simpática lombar. Dor de raiz cervical por hérnia se trata na raiz ou no espaço epidural, e não no gânglio.',
    ind: 'Dor mantida pelo simpático no membro superior, como a síndrome de dor regional complexa, e dor isquêmica por doença vascular, como o fenômeno de Raynaud, o vasoespasmo e a embolia arterial do braço. Também se usa em hiperidrose, herpes-zóster agudo da face e do braço, arritmia ventricular refratária e, mais recentemente, no transtorno de estresse pós-traumático.',
    alvo: 'O gânglio estrelado, fusão do gânglio cervical inferior com o primeiro torácico, fica à frente do colo da primeira costela e do transverso de C7, junto à cúpula pleural e à artéria vertebral. Por isso a agulha costuma parar no tubérculo anterior de C6 (tubérculo de Chassaignac), mais seguro e palpável, e o injetado desce pela fáscia pré-vertebral até C7 e T1; A via em C7 fica mais perto do gânglio, mas também da artéria vertebral, que passa à frente do transverso de C7, e da pleura.',
    tec: 'Decúbito dorsal com o pescoço em leve extensão. Na radioscopia a agulha toca a junção do corpo com o transverso de C6 ou C7 e o contraste deve correr na fáscia pré-vertebral; No ultrassom veem-se carótida, tireoide, esôfago, artéria vertebral e o músculo longo do pescoço, e a ponta fica sobre esse músculo e abaixo da fáscia pré-vertebral, o que permite volume menor (Narouze, Curr Pain Headache Rep 2014). Na técnica às cegas, 3 de 12 pacientes tiveram hematoma, contra nenhum com ultrassom (Kapral, Reg Anesth 1995).',
    inj: 'Anestésico local em volume pequeno: no estudo pioneiro com ultrassom bastaram 5 mL de bupivacaína a 0,25%, contra 8 mL na técnica às cegas (Kapral, Reg Anesth 1995). A síndrome de Horner do mesmo lado, com ptose, miose e vermelhidão da conjuntiva, é o sinal de sucesso do bloqueio simpático da cabeça, e o aquecimento da mão confirma o alcance no braço.',
    risco: 'Num inquérito com cerca de 45.000 bloqueios, as complicações graves foram 1,7 por 1.000, a maioria convulsões por injeção intra-arterial, além de 6 raquianestesias altas e 9 pneumotórax (Wulf, Anaesthesist 1992). Uma dose mínima injetada na artéria vertebral chega direto ao cérebro e causa convulsão em segundos; O bloqueio do nervo laríngeo recorrente provoca rouquidão e sensação de bolo na garganta, e por isso não se bloqueiam os dois lados no mesmo dia.',
    evid: 'Na síndrome de dor regional complexa, a revisão Cochrane de 12 ensaios pequenos, com 461 pacientes, não mostrou benefício do bloqueio simpático com anestésico local sobre placebo, com evidência de qualidade baixa a muito baixa (O\'Connell, Cochrane 2016). No estresse pós-traumático, dois bloqueios à direita reduziram a escala CAPS-5 em 12,6 pontos, contra 6,1 com simulação, em 8 semanas, num ensaio com 113 militares (Rae Olmsted, JAMA Psychiatry 2020).',
    pro: 'Aspiração negativa e dose-teste não garantem que a injeção não seja intra-arterial, e por isso acesso venoso, anticonvulsivante e material de reanimação ficam à mão (Wulf, Anaesthesist 1992). O ultrassom mostra a artéria vertebral e a tireoidiana inferior antes da punção, o que a radioscopia, que só vê osso, não faz (Narouze, Curr Pain Headache Rep 2014).'
  },
  {
    id: 'celiac', levels: ['T11', 'T12', 'L1', 'L2'], cat: 0, name: 'Bloqueio do plexo celíaco', lv: 'T12-L1, bilateral',
    mods: { celiac: true, needles: [{ to: 'celiac.tip.L', via: 'celiac.via.L', len: 12, key: 'needle.L', level: 'L1' }, { to: 'celiac.tip.R', via: 'celiac.via.R', len: 12, key: 'needle.R', level: 'L1' }],
      contrast: [{ path: 'celiac', r: 0.32, key: 'contrast.celiac', level: 'L1' }, { at: 'celiac.tip.L', r: 0.3, key: 'contrast.L', level: 'L1' }, { at: 'celiac.tip.R', r: 0.3, key: 'contrast.R', level: 'L1' }] },
    cam: { t: 'celiac', az: 0, el: -72, d: 24 }, show: 'bone neuro vessel rib', clip: 'ax:L1', hide: ['plex', 'bvv', 'asa', 'psa'], focus: ['T11', 'T12', 'L1', 'L2'], hot: [],
    labels: [['celiac', 'Tronco celíaco'], ['cgg.L', 'Gânglio celíaco'], ['needle.L', 'Ponta anterolateral à aorta'], ['contrast.celiac', 'Contraste em volta do plexo'], ['aorta.cel', 'Aorta'], ['splanch.L', 'Nervo esplâncnico maior']],
    regiao: 'Transição toracolombar, na altura de T12-L1, à frente da aorta em torno do tronco celíaco, em geral pelos dois lados.', nao: 'Dor pélvica ou perineal, fora do território celíaco: outro alvo, como a neurólise intratecal em sela na dor perineal do câncer pélvico. Na pancreatite crônica o resultado é pior e menos duradouro.',
    ind: 'Dor visceral do abdome superior por câncer de pâncreas e de outros órgãos do andar superior, como estômago, vias biliares e fígado, mal controlada por opioides ou com efeitos adversos que limitam a dose. O bloqueio com anestésico serve de teste e a neurólise com álcool é o tratamento; Na pancreatite crônica o resultado é pior e menos duradouro.',
    alvo: 'O plexo celíaco, rede de gânglios à frente da aorta, ao redor da origem do tronco celíaco, na altura de T12-L1, que recebe pelos nervos esplâncnicos as fibras de dor do pâncreas, estômago, fígado, vias biliares e intestino até o cólon transverso. Na via retrocrural a agulha para atrás dos pilares do diafragma, sobre os nervos esplâncnicos; Na transcrural e na transaórtica o injetado fica à frente da aorta, sobre o próprio plexo.',
    tec: 'Na via posterior, decúbito ventral, radioscopia ou TC e duas agulhas, uma de cada lado, que entram abaixo da 12ª costela e avançam rente ao corpo de L1 até a frente da coluna. Na via transaórtica a agulha esquerda atravessa a aorta de propósito, guiada por aspiração e contraste, e na ecoendoscopia a agulha sai da parede do estômago e injeta junto à origem do tronco celíaco. O contraste deve ficar à frente da aorta ou do corpo vertebral, sem desenho vascular nem recuo para o psoas.',
    inj: 'Teste com anestésico local e neurólise com álcool de 50% a 100%, em geral de 15 a 50 mL pela via posterior bilateral, a técnica mais usada na meta-análise (Eisenberg, Anesth Analg 1995). O álcool puro arde muito ao ser injetado, por isso vem precedido de anestésico local; O fenol é a alternativa menos dolorosa.',
    risco: 'Os efeitos adversos comuns são transitórios: dor local em 96%, diarreia em 44% e hipotensão em 38%, por vasodilatação esplâncnica e predomínio parassimpático, com complicações em 2% (Eisenberg, Anesth Analg 1995). A paraplegia, por lesão ou espasmo das artérias segmentares que nutrem a medula, ocorreu em 4 de 2.730 neurólises na Inglaterra e no País de Gales, 1 caso grave por 683 bloqueios (Davies, J R Soc Med 1993).',
    evid: 'Num ensaio duplo-cego com 100 pacientes com câncer de pâncreas irressecável, a neurólise aliviou mais a dor que a analgesia sistêmica com injeção simulada, com dor moderada a intensa nas 6 primeiras semanas em 14% contra 40%, sem diferença em qualidade de vida, consumo de opioide ou sobrevida (Wong, JAMA 2004). A revisão Cochrane mostrou ganho pequeno, 0,42 ponto na dor em 4 semanas, com menos opioide (Arcidiacono, Cochrane 2011), e a neurólise por ecoendoscopia aliviou 80% dos pacientes com câncer de pâncreas e 59% dos com pancreatite crônica (Puli, Dig Dis Sci 2009).',
    pro: 'O ganho está mais na redução do opioide e dos seus efeitos adversos que numa grande queda da dor (Arcidiacono, Cochrane 2011). Hidratação venosa antes da neurólise e repouso deitado nas horas seguintes previnem a hipotensão ortostática, e a diarreia costuma ceder em poucos dias.'
  },
  {
    id: 'intrathecal', levels: ['L2', 'L3', 'L4', 'L5', 'S'], cat: 0, name: 'Bloqueio subaracnoide (intratecal) e neurolítico', lv: 'L3-L4, linha média',
    mods: { sacralCanal: true, needles: [{ to: ['L3-L4', 0, -0.25, -2.85], via: ['L3-L4', 0, -2.6, -11.2], g: 25, tipR: 0.12, tipL: 0.22, key: 'spinal', info: 'spinal', level: 'L3-L4' }],
      contrast: [{ csf: ['L3-L4', 'S2'], key: 'csf', info: 'csfdrug', level: 'L4' }] },
    cam: { t: 'L4', az: 90, el: 4, d: 36 }, show: 'bone disc lig neuro', clip: 'sag', focus: ['L2', 'L3', 'L4', 'L5', 'S'], hot: [],
    labels: [['spinal', 'Ponta no espaço subaracnoide'], ['spinal.meio', 'Agulha espinhal 25G'], ['csf', 'Solução descendo no líquor'], ['flav.L3-L4.R', 'Ligamento amarelo'], ['rootIn.L5.R', 'Raízes da cauda equina'], ['duraEnd', 'Raízes sacrais (bloqueio em sela)']],
    regiao: 'Lombar, abaixo do fim da medula, em geral L3-L4 ou L4-L5 na linha média; Na neurólise em sela, a posição do corpo leva a solução às raízes sacrais.', nao: 'Dor visceral do abdome superior por câncer: o alvo é o plexo celíaco. Analgesia por dias no pós-operatório vai pelo cateter peridural, e a neurólise não serve a quem tem vida longa pela frente.',
    ind: 'A raquianestesia diagnóstica, com anestésico local em doses crescentes ou comparada a placebo, ajuda a separar dor somática, visceral, simpática e central quando a origem é incerta, e a raquianestesia terapêutica em dose única cobre procedimentos e crises de dor aguda. O opioide intratecal, em injeção única de teste ou por bomba implantada, trata a dor oncológica refratária ou com efeitos adversos que limitam a dose sistêmica; A neurólise intratecal fica para dor oncológica localizada em poucos dermátomos e expectativa de vida curta, como a dor perineal do câncer pélvico avançado, tratada pelo bloqueio em sela das raízes sacrais.',
    alvo: 'O espaço subaracnoide lombar, abaixo do fim da medula, onde o líquor banha as raízes da cauda equina. O opioide age nos receptores do corno dorsal da medula com dose muito menor que a sistêmica, e o neurolítico age nas raízes posteriores, sensitivas, escolhidas: a posição do corpo leva a solução até elas e a afasta das raízes motoras anteriores e das que controlam a bexiga e o esfíncter anal.',
    tec: 'Agulha espinhal de ponta de lápis, que afasta as fibras da dura em vez de cortá-las, em L3-L4, com o retorno de líquor confirmando a posição. No bloqueio em sela com fenol hiperbárico, mais denso que o líquor, a pessoa fica sentada e inclinada para trás para que a solução desça às raízes sacrais posteriores; Com álcool hipobárico, menos denso, o lado doloroso fica para cima e o decúbito ventral inclinado faz a solução subir às raízes posteriores. Para a bomba, um cateter intratecal é tunelizado até um reservatório no subcutâneo do abdome, depois de um teste com injeção única ou infusão temporária.',
    inj: 'Na raquianestesia, anestésico local em dose única; Na via intratecal crônica, a morfina é o opioide mais usado, às vezes somada a anestésico local, clonidina ou ziconotida. Na neurólise, pequenos volumes de fenol em glicerina ou de álcool absoluto, injetados devagar e em frações, com a pessoa mantida na posição até o agente se fixar nas raízes.',
    risco: 'A cefaleia pós-punção caiu de 11,0% com agulha cortante para 4,2% com agulha atraumática numa meta-análise de 110 ensaios (Nath, Lancet 2018), e só nas agulhas cortantes o calibre mais fino reduziu a taxa, em cerca de 1,36% por gauge, sem efeito do calibre nas de ponta de lápis (Zorrilla-Vaca, J Anesth 2016). Na neurólise, o risco que define a indicação é a perda de controle da bexiga e do esfíncter anal e a fraqueza nas pernas, por difusão do agente para raízes sacrais anteriores ou lombares; Por isso o bloqueio em sela é mais aceito em quem já tem estoma ou derivação urinária. Bomba e cateter acrescentam infecção, falha do sistema e efeitos do opioide, como sedação e depressão respiratória.',
    evid: 'Num ensaio com 202 pacientes com dor oncológica refratária, a bomba intratecal somada ao tratamento clínico teve sucesso em 84,5% contra 70,8% com tratamento clínico isolado, reduziu a toxicidade dos fármacos em 50% contra 17% e deixou mais pessoas vivas em 6 meses, 53,9% contra 37,2%, diferença sem significância estatística (Smith, J Clin Oncol 2002). Para a neurólise intratecal não há ensaios controlados, e a literatura é feita de séries de casos e opinião de especialistas (Candido, Best Pract Res Clin Anaesthesiol 2003); Em 4 pacientes com derivação urinária prévia, o bloqueio em sela com fenol permitiu reduzir o opioide sistêmico em mais de 60% (Slatkin, Am J Hosp Palliat Care 2003).',
    pro: 'Na neurólise a posição é o procedimento: o fenol desce e o álcool sobe no líquor, e a pessoa é posicionada para que só as raízes posteriores escolhidas fiquem no caminho da solução. A agulha de ponta de lápis vale também para a raquianestesia diagnóstica e para o teste da bomba, porque reduz a cefaleia sem piorar o sucesso na primeira tentativa (Nath, Lancet 2018).'
  },
  {
    id: 'epicath', levels: ['L1', 'L2', 'L3'], cat: 0, name: 'Cateter peridural para infusão contínua', lv: 'L2-L3 paramediano direito',
    mods: { needles: [{ to: ['L2-L3', -0.03, -0.75, -3.36], via: ['L2-L3', -1.6, -4.2, -10.5], g: 18, key: 'tuohy', info: 'tuohy', level: 'L2-L3' }],
      scopes: [{ path: [['L2-L3', -0.03, -0.75, -3.36], ['L2-L3', -0.25, -0.2, -3.16], ['L2-L3', -0.4, 0.6, -3.1], ['L2', -0.4, -0.6, -3.04], ['L2', -0.4, 0.4, -3.02], ['L1-L2', -0.4, 0, -3.02], ['L1', -0.4, -0.6, -2.95]], r: 0.045, kind: 'needleTip', key: 'cath', info: 'catheter', level: 'L2' }] },
    cam: { t: 'dura.L2', az: 70, el: 8, d: 20 }, show: 'bone disc lig neuro', clip: 'sag', focus: ['L1', 'L2', 'L3'], hot: [],
    labels: [['tuohy', 'Ponta da Tuohy no epidural posterior'], ['cath', 'Ponta do cateter, 4 a 5 cm acima'], ['cath.meio', 'Cateter subindo atrás da dura'], ['flav.L2-L3.R', 'Ligamento amarelo'], ['dura.L2', 'Saco dural']],
    regiao: 'Torácica ou lombar, com a ponta do cateter perto dos dermátomos da dor: torácica para tórax e abdome superior, lombar, como L2-L3, para pelve e pernas.', nao: 'Ciática ou dor radicular crônica por hérnia ou estenose: a escolha é a injeção única de corticoide, transforaminal ou interlaminar. Dor oncológica por meses tende a ir para o opioide intratecal por bomba.',
    ind: 'Analgesia pós-operatória de cirurgias abdominais, torácicas e de membros inferiores, dor oncológica do tronco ou da pelve mal controlada por via sistêmica e, em casos selecionados, síndrome de dor regional complexa do membro inferior, em que a infusão permite reabilitar com menos dor. O cateter transforma o bloqueio de dose única numa analgesia de dias ou semanas, ajustável ao longo do tempo.',
    alvo: 'O espaço epidural posterior em L2-L3, entre o ligamento amarelo e a dura, de onde o cateter sobe alguns centímetros e banha as raízes de vários segmentos acima e abaixo da ponta. O anestésico age nas raízes que atravessam o espaço epidural e o opioide atravessa a dura até o corno dorsal da medula, por isso a ponta do cateter fica perto dos dermátomos da dor.',
    tec: 'Decúbito lateral ou sentado, agulha de Tuohy na linha média ou paramediana até a perda de resistência ao passar o ligamento amarelo, e cateter passado pela agulha com a ponta curva voltada para cima. Num ensaio em parturientes, o cateter multiorifício introduzido 5 cm no espaço epidural deu a melhor analgesia, e com 7 cm houve mais complicações na inserção (Beilin, Anesth Analg 1995); Com mais de 2 cm no espaço, 23% dos cateteres precisaram ser manipulados, e os de 8 cm entraram mais em veia (D\'Angelo, Anesthesiology 1996). Aspiração, dose-teste e fixação firme na pele vêm antes da infusão, e para uso de semanas o cateter pode ser tunelizado.',
    inj: 'Anestésico local em baixa concentração, em infusão contínua ou controlada pela pessoa, com ou sem opioide. Adjuvantes, sobretudo opioide e epinefrina, aumentam a taxa de sucesso, e a analgesia controlada pela pessoa com infusão de fundo parece o melhor esquema no pós-operatório (Hermanides, Br J Anaesth 2012); Com infusão contínua, a dose total pesa mais na qualidade do bloqueio que o volume ou a concentração isolados (Hermanides, Br J Anaesth 2012).',
    risco: 'A falha da analgesia é mais comum do que se pensa e vem de posição errada da ponta, migração secundária do cateter depois de bem colocado e dose insuficiente (Hermanides, Br J Anaesth 2012). O hematoma espinhal ocorreu em 1 a cada 200.000 peridurais obstétricas, contra 1 a cada 3.600 mulheres submetidas a artroplastia de joelho (Moen, Anesthesiology 2004), e o cuidado com anticoagulantes vale tanto para a punção quanto para a retirada do cateter; A punção dural acidental ocorreu em 1,5% das peridurais obstétricas (Choi, Can J Anaesth 2003), e infecção e abscesso epidural crescem com o tempo de permanência do cateter.',
    evid: 'Numa meta-análise de 100 ensaios, a analgesia peridural foi melhor que o opioide parenteral em todos os dias de pós-operatório, com dor média de 19,4 contra 29,4 mm numa escala de 100 mm (Block, JAMA 2003). Na síndrome de dor regional complexa, a clonidina peridural em bolo aliviou a dor contra placebo num ensaio com 26 pacientes, e 19 seguiram em infusão aberta por uma média de 43 dias, com sedação e hipotensão limitando o bolo (Rauck, Anesthesiology 1993). Na dor oncológica, a evidência vem sobretudo de séries de casos, e a infusão peridural costuma servir de ponte ou de teste antes da via intratecal.',
    pro: 'Num censo britânico de 707.455 bloqueios neuraxiais, a lesão permanente ficou entre 2,0 e 4,2 por 100.000, e dois terços das lesões de início incapacitantes regrediram por completo (Cook, Br J Anaesth 2009). Cateter que dá bloqueio de um lado só costuma estar fundo demais e melhora ao ser recuado aos poucos, manobra que salvou a analgesia em 91% dos bloqueios unilaterais (D\'Angelo, Anesthesiology 1996).'
  },
  {
    id: 'rfface', levels: ['L3', 'L4', 'L5'], cat: 1, name: 'Radiofrequência do ramo medial', lv: 'Faceta L4-L5 esquerda',
    mods: { mbranch: ['L3', 'L4'], rf: ['L3.L', 'L4.L'] },
    cam: { t: 'L4.tp.L', az: 145, el: 18, d: 24 }, show: 'bone neuro', focus: ['L3', 'L4', 'L5', 'S'], hot: [],
    labels: [['mb.L3.L', 'Ramo medial de L3'], ['mb.L4.L', 'Ramo medial de L4'], ['rflesion.L3.L', 'Lesão de radiofrequência'], ['rf.L4.L', 'Agulha paralela ao nervo'], ['L4.tp.L', 'Transverso de L4']],
    regiao: 'Ramos mediais das facetas lombares, mais em L3-L4, L4-L5 e L5-S1, onde em L5-S1 o alvo é o ramo dorsal de L5 na asa do sacro; Também na cervical e na torácica.', nao: 'Sem bloqueio diagnóstico positivo, ou com dor que desce pela perna: primeiro o bloqueio do ramo medial, ou o transforaminal. Dor glútea abaixo de L5 pede investigar a sacroilíaca.',
    ind: 'Dor lombar axial crônica de origem facetária, sem radiculopatia, que persiste após cerca de 3 meses de tratamento conservador (Cohen, Reg Anesth Pain Med 2020). Exige bloqueio diagnóstico do ramo medial positivo antes, porque exame e imagem não apontam a faceta dolorosa: o padrão clássico é alívio de pelo menos 80% em dois bloqueios comparativos, e a diretriz multissociedade aceita um único bloqueio com 50% (Cohen, Reg Anesth Pain Med 2020).',
    alvo: 'O ramo medial do ramo dorsal, onde cruza a junção do processo articular superior com a base do processo transverso, sob o ligamento mamilo-acessório. Cada faceta recebe dois ramos: a L4-L5 é inervada pelos ramos mediais de L3 e de L4, que cruzam os transversos de L4 e L5, e a L5-S1 pelo ramo medial de L4 e pelo ramo dorsal de L5, que corre na asa do sacro.',
    tec: 'Decúbito ventral, radioscopia com inclinação caudal e oblíqua, para que a agulha de RF corra paralela ao nervo pela goteira entre o articular superior e o transverso, com a ponta ativa sobre o colo do articular superior. A lesão térmica cresce em volta da ponta ativa e pouco à frente dela, e a agulha perpendicular, usada em parte do MINT, tende a errar o nervo (Cohen, Reg Anesth Pain Med 2020). A posição é conferida em AP, oblíqua e perfil; Estimulação motora com contração do multífido e sem resposta na perna afasta a proximidade da raiz.',
    inj: 'No bloqueio diagnóstico, pequeno volume de anestésico local, de 0,3 a 1 mL por ramo medial (Cohen, Reg Anesth Pain Med 2020). Na neurotomia, após anestesia local do trajeto, a radiofrequência aquece a ponta a 80 °C a 90 °C por 1 a 3 min em cada lesão (Cohen, Reg Anesth Pain Med 2020); Agulhas mais calibrosas e tempos maiores fazem lesões maiores e mais previsíveis.',
    risco: 'Complicações graves são raras; O mais comum é dor ou disestesia transitória no local e dormência na pele inervada pelo ramo lesado. Na cervical, 5 de 12 tratados tiveram dormência na área dos nervos lesados, nenhum incomodado por ela (Lord, NEJM 1996). Há ainda risco de queimadura pela placa de dispersão e de lesão da raiz se a ponta estiver ventral demais, e a denervação do multífido é esperada (Dreyfuss, Spine 2000).',
    evid: 'Com seleção por bloqueios controlados, 60% tiveram pelo menos 90% de alívio em 12 meses (Dreyfuss, Spine 2000), e 53% a 58% ficaram sem dor por pelo menos 6 meses, com alívio de cerca de 15 meses após a primeira neurotomia (MacVicar, Pain Med 2013). O MINT, com 251 pacientes no braço facetário, não mostrou diferença clinicamente importante sobre exercício isolado (menos 0,18 ponto na escala de 0 a 10 em 3 meses), num desenho aberto e com seleção por um único bloqueio (Juch, JAMA 2017), e foi criticado por usar agulha perpendicular ao nervo (Cohen, Reg Anesth Pain Med 2020). Na cervical, o ensaio contra simulação mostrou mediana de 263 dias até a dor voltar a 50%, contra 8 dias (Lord, NEJM 1996).',
    pro: 'Em L5-S1 o alvo de L5 não é um ramo medial e sim o ramo dorsal na goteira entre a asa do sacro e o articular superior de S1, e a crista ilíaca limita a angulação. Agulha paralela e lesão grande valem mais que a estimulação sensitiva antes de lesar (Dreyfuss, Spine 2000).'
  },
  {
    id: 'rfsi', levels: ['L5', 'S'], cat: 1, name: 'Radiofrequência sacroilíaca', lv: 'Ramos laterais S1 a S3 direitos',
    mods: { ilium: true, sacralLB: { side: 'R', lv: [1, 2, 3], rf: true } },
    cam: { t: 'lb.S2.R', az: -175, el: 25, d: 22 }, show: 'bone neuro', focus: ['L4', 'L5', 'S', 'Co'], hot: [],
    labels: [['sfd.1.R', 'Forame sacral dorsal S1'], ['lb.S1.R', 'Ramos laterais de S1'], ['rfl.S2.R', 'Lesões em fileira'], ['rfs.S2.R', 'Agulha de RF'], ['sij.R', 'Articulação sacroilíaca']],
    regiao: 'Ramos laterais de S1 a S3 na face dorsal do sacro e ramo dorsal de L5 na asa do sacro, às vezes também o de L4, do lado da dor.', nao: 'Sacroilíaca não confirmada por bloqueio: primeiro o bloqueio sacroilíaco diagnóstico. Na sacroileíte inflamatória a injeção intra-articular com corticoide vem antes da denervação.',
    ind: 'Dor sacroilíaca crônica confirmada por bloqueio, com alívio que não se sustenta após injeção intra-articular, sobretudo quando a dor vem do complexo ligamentar posterior. A seleção usa bloqueio intra-articular ou dos ramos laterais, e no ensaio de Patel exigiu dois bloqueios dos ramos laterais positivos (Patel, Pain Med 2012).',
    alvo: 'A face posterior da articulação é inervada pelos ramos laterais dos ramos dorsais de S1 a S3, que saem dos forames sacrais posteriores e correm em leque pela face dorsal do sacro, e pelo ramo dorsal de L5, que corre na asa do sacro; Alguns protocolos incluem também o ramo dorsal de L4 (Cohen, Anesthesiology 2008). A parte anterior da articulação, inervada pela frente, não é alcançada, o que limita o teto da técnica.',
    tec: 'Decúbito ventral e radioscopia, com lesões em volta da borda lateral dos forames sacrais posteriores de S1 a S3, onde os ramos laterais variam de número e posição entre pessoas e entre os lados, além da lesão do ramo dorsal de L5 na goteira da asa do sacro. A RF resfriada circula água na ponta do eletrodo, que impede a carbonização junto à ponta e deixa a lesão crescer mais, cobrindo a variação dos ramos com menos agulhas; Alternativas são lesões convencionais em série ou em faixa contínua.',
    inj: 'Anestésico local no trajeto e em cada ponto antes da lesão térmica, que na RF resfriada mantém a ponta mais fria e forma uma lesão maior no tecido em volta. A estimulação motora antes de lesar confirma que a ponta está longe das raízes sacrais.',
    risco: 'As complicações são em geral leves: dor e disestesia transitórias no local, dormência na pele da nádega inervada pelos nervos clúnios médios e, raramente, lesão de raiz sacral se a ponta entrar no forame. Há ainda risco de queimadura pela placa de dispersão e de infecção.',
    evid: 'Contra placebo, a RF resfriada de L4, L5 e S1 a S3 deu pelo menos 50% de alívio com melhora funcional a 79%, 64% e 57% dos tratados em 1, 3 e 6 meses, contra 14% em 1 mês e nenhum em 3 meses com placebo, mas só 14% mantinham o alívio em 1 ano (Cohen, Anesthesiology 2008). No ensaio de Patel, com 51 pacientes, 47% dos tratados e 12% dos simulados tiveram sucesso em 3 meses (Patel, Pain Med 2012). No braço sacroilíaco do MINT, com 228 pacientes, a RF somada a exercício reduziu a dor só 0,71 ponto a mais que exercício isolado em 3 meses, abaixo dos 2 pontos definidos como clinicamente importantes (Juch, JAMA 2017).',
    pro: 'Os ensaios positivos foram controlados por placebo e usaram RF resfriada; O MINT, negativo, foi aberto e comparou a RF com exercício isolado (Juch, JAMA 2017). Pela variação anatômica dos ramos laterais, a lesão precisa cobrir toda a borda lateral de cada forame, de S1 a S3.'
  },
  {
    id: 'rfdisc', levels: ['L4', 'L5'], cat: 2, name: 'Biacuplastia', lv: 'L4-L5',
    mods: { discRF: 'L4-L5' },
    cam: { t: 'ax.L4-L5', az: 0, el: -78, d: 15 }, show: 'bone disc neuro', clip: 'ax:L4-L5', focus: ['L4', 'L5'], hot: [],
    labels: [['heat.L4-L5', 'Lesão no anel posterior'], ['probe.L', 'Sonda resfriada esquerda'], ['probe.R', 'Sonda resfriada direita'], ['nuc.L4-L5', 'Núcleo'], ['cauda', 'Saco dural']],
    regiao: 'Discos lombares, mais em L4-L5 e L5-S1, com as duas sondas no anel fibroso posterior do disco doloroso.', nao: 'Hérnia com dor na perna, estenose, listese ou disco muito baixo: hérnia contida vai para nucleoplastia, PLDD ou ozônio. Dor lombar com Modic tipo 1 ou 2 nas placas aponta para a basivertebral.',
    ind: 'Dor lombar axial crônica de origem discal, sem radiculopatia compressiva, com mais de 6 meses e sem resposta ao tratamento conservador, em disco degenerado que ainda conserva altura e tem discografia provocativa positiva com disco de controle negativo. No ensaio contra simulação, a altura do disco precisava ser de pelo menos 50% da do disco de controle, e hérnia, estenose, listese e cirurgia lombar prévia eram critérios de exclusão (Kapural, Pain Med 2013).',
    alvo: 'O anel fibroso posterior de L4-L5, onde se concentram as fissuras radiais e as terminações nociceptivas que crescem para dentro do disco degenerado, inervadas pelo nervo sinuvertebral e por ramos do tronco simpático. A ideia é desnervar e coagular essa faixa posterior de anel sem aquecer o núcleo nem as raízes que passam logo atrás dela, no canal e no forame.',
    tec: 'Decúbito ventral, sedação leve para que a pessoa relate sintoma na perna, e duas agulhas introdutoras por via posterolateral oblíqua, uma de cada lado, como na discografia, até o anel posterior de L4-L5. Na biacuplastia convencional passam por elas duas sondas de radiofrequência resfriadas por água circulante, em modo bipolar: a corrente corre de uma ponta à outra e aquece a faixa de anel entre elas, enquanto o resfriamento evita carbonizar o tecido junto à ponta; No IDET, seu antecessor, um único cateter térmico era enrolado por dentro do anel posterior e aquecido a 90 °C (Pauza, Spine J 2004). A variante chamada expansível não tem descrição técnica nem ensaio localizados em literatura indexada, e os resultados abaixo valem só para a técnica convencional.',
    inj: 'Não se injeta fármaco: o tratamento é a energia térmica da radiofrequência, com anestesia local no trajeto e sedação leve. Pequena quantidade de contraste pode confirmar a posição intradiscal antes de aquecer, e o cuidado com a assepsia é o de toda punção discal.',
    risco: 'No ensaio contra simulação e no seguimento de 12 meses não houve complicação relacionada ao procedimento (Kapural, Pain Med 2015). Os riscos são os de toda punção discal, como discite, lesão térmica da raiz se a sonda sair do anel e aceleração da degeneração do disco puncionado, já demonstrada após discografia (Carragee, Spine 2009).',
    evid: 'O IDET teve resultado misto: num ensaio contra simulação cerca de 40% tiveram mais de 50% de alívio, com número necessário para tratar de 5 para alívio de 75% (Pauza, Spine J 2004), e outro ensaio não mostrou benefício algum (Freeman, Spine 2005). Na biacuplastia, de 1.894 triados só 59 foram tratados, e o grupo ativo melhorou mais que a simulação em 6 meses (Kapural, Pain Med 2013), com queda média de 2,9 pontos na dor e ganho de 22 pontos na função física do SF-36 mantidos em 12 meses (Kapural, Pain Med 2015). Contra tratamento conservador, em ensaio aberto, a dor caiu 2,4 contra 0,56 pontos em 6 meses, com 50% contra 18% de respondedores (Desai, Spine 2016).',
    pro: 'A seleção é muito estreita, com discografia positiva e controle negativo, disco com altura e ausência de hérnia, estenose ou listese, e uma revisão questiona se esses resultados valem para a população geral com dor discal (Lu, Spine 2014). As duas sondas simétricas no terço posterior do disco, conferidas em AP e perfil, são o ponto técnico decisivo, porque a lesão bipolar cobre a faixa entre elas e não a que fica de fora.'
  },
  {
    id: 'discog', levels: ['L3', 'L4', 'L5'], cat: 2, name: 'Discografia provocativa', lv: 'L4-L5, controle em L3-L4',
    mods: { disc: { 'L4-L5': { dye: 'leak' }, 'L3-L4': { dye: 'in' } }, needles: [{ to: 'nuc.L4-L5', via: ['L4-L5', -7.37, 0, -5.43], key: 'needle.L4', level: 'L4-L5' }, { to: 'nuc.L3-L4', via: ['L3-L4', -7.37, 0, -5.42], key: 'needle.L3', level: 'L3-L4' }] },
    cam: { t: 'nuc.L4-L5', az: 90, el: 4, d: 22 }, show: 'bone disc neuro', clip: 'sag', focus: ['L2', 'L3', 'L4', 'L5', 'S'], hot: [],
    labels: [['leak.L4-L5', 'Contraste pela fissura posterior'], ['nuc.L4-L5', 'L4-L5: contraste no núcleo'], ['nuc.L3-L4', 'L3-L4: contraste contido'], ['needle.L4.meio', 'Agulha posterolateral'], ['root.L4.R', 'Raiz L4']],
    regiao: 'Discos lombares, o suspeito e um disco de controle de aspecto normal, como L4-L5 com controle em L3-L4.', nao: 'Exame de rotina, resultado que não muda a conduta, ou dor crônica difusa e testes psicométricos alterados, que elevam os falsos positivos (Carragee, Spine 2006). Dor na perna se investiga pela raiz.',
    ind: 'Dor lombar axial crônica em que a RM mostra um ou mais discos degenerados e se cogita um tratamento dirigido ao disco, como artrodese, prótese ou procedimento intradiscal, sendo preciso saber qual disco, se algum, reproduz a dor. Não é exame de rotina: é um teste provocativo e subjetivo, reservado para quando o resultado muda a conduta.',
    alvo: 'O núcleo pulposo de L4-L5, o disco suspeito, e o de L3-L4 como nível de controle, um disco de aspecto normal ou menos degenerado na RM. O teste compara as respostas: o suspeito deve reproduzir a dor habitual e o controle não deve doer, porque sem controle negativo não há como separar o disco doloroso de quem sente dor em qualquer injeção.',
    tec: 'Decúbito ventral, sedação mínima para que a pessoa relate a dor, e agulha por via oblíqua extrapedicular até o centro do disco, em geral pela técnica de duas agulhas (uma guia e outra fina por dentro dela) para reduzir contaminação, entrando pelo lado oposto ao da dor predominante. O contraste é injetado devagar com manômetro, registrando a pressão de abertura, a pressão em que a dor aparece, sua intensidade e se ela é concordante, isto é, igual à dor habitual em local e caráter, de preferência com avaliação cega quanto ao disco testado. Dor concordante a baixa pressão, até cerca de 15 psi acima da pressão de abertura, tem menos falso-positivo (Wolfer, Pain Physician 2008), e a TC logo depois mostra as fissuras do anel.',
    inj: 'Contraste iodado não iônico em pequeno volume, com manômetro em linha. Muitos serviços usam antibiótico profilático, intravenoso ou misturado ao contraste, mas a revisão sistemática não encontrou evidência suficiente de que ele previna discite (Willems, J Spinal Disord Tech 2004).',
    risco: 'Sem antibiótico profilático, discite ocorreu em 0,25% dos pacientes e em 0,094% dos discos puncionados (Willems, J Spinal Disord Tech 2004). Em voluntários sem doença lombar importante, os discos injetados tiveram, 10 anos depois, mais progressão da degeneração (35% contra 14%) e mais hérnias novas (55 contra 22), sobretudo do lado da punção, que os mesmos níveis em controles pareados (Carragee, Spine 2009). Por isso o dano ao próprio disco testado, inclusive ao nível de controle, entra na conta do risco.',
    evid: 'Em pessoas sem história de dor lombar, a injeção foi dolorosa em 10% dos sem dor, 40% dos com dor cervical crônica e 83% dos com transtorno de somatização (Carragee, Spine 2000), e 25% dos voluntários sem dor lombar crônica tiveram ao menos um disco positivo a baixa pressão, menos de 22 psi acima da abertura (Carragee, Spine 2006). Uma meta-análise de estudos em assintomáticos estimou falso-positivo de 9,3% por pessoa e especificidade de 0,94 com os critérios da ISIS (Wolfer, Pain Physician 2008). A controvérsia persiste porque não há padrão-ouro independente para a dor discogênica.',
    pro: 'O exame só tem valor com nível de controle negativo, pressão medida e resposta julgada sem que a pessoa saiba qual disco está sendo injetado; Dor crônica em outro lugar, discectomia prévia e testes psicométricos alterados elevam os positivos em quem não tem dor lombar (Carragee, Spine 2006). Como a punção acelera a degeneração (Carragee, Spine 2009), o número de discos puncionados, controle incluso, deve ser o mínimo que responde à pergunta.'

    regiao: 'Discos lombares, mais em L4-L5 e L5-S1, com injeção no núcleo e no forame da raiz comprimida; Também na cervical, com menos dados.', nao: 'Hérnia calcificada, estenose do canal, recidiva com fibrose ou hérnia do recesso lateral, em que mais falhou (Muto, J Neuroradiol 2004). Déficit que progride pede discectomia.',
    ind: 'Dor radicular lombar por hérnia de disco, sobretudo contida e não calcificada, sem déficit motor progressivo, que não melhorou com tratamento conservador. Numa grande série, as falhas se concentraram em hérnia calcificada, estenose do canal, recidiva com fibrose epidural e hérnia pequena descendente no recesso lateral (Muto, J Neuroradiol 2004).',
    alvo: 'O núcleo pulposo de L4-L5, onde o ozônio age sobre a matriz do disco, e o forame L4-L5, ao redor da raiz comprimida, onde a injeção periforaminal leva ozônio, corticoide e anestésico à interface entre hérnia e raiz. Em estudos de mecanismo, o ozônio fragmentou os proteoglicanos do núcleo e desidratou o disco, e num modelo matemático uma redução de 6% no volume baixou a pressão intradiscal em 9,84% (Murphy, J Vasc Interv Radiol 2016).',
    tec: 'Decúbito ventral, agulha fina por via posterolateral oblíqua até o centro do disco sob radioscopia ou TC, como na discografia, e depois recuo da agulha até o forame para a injeção periforaminal. Num protocolo publicado, foram 8 mL de mistura de oxigênio e ozônio a 28 µg/mL dentro do disco e mais 4 mL no forame ao retirar a agulha, junto com dexametasona 4 mg e bupivacaína (Bisshopp, J Clin Med 2025); A TC logo depois mostra a distribuição do gás no disco e no espaço epidural (Muto, J Neuroradiol 2004).',
    inj: 'Mistura de oxigênio e ozônio em concentração baixa, produzida na hora por gerador médico e injetada logo, porque o ozônio é instável e se decompõe em oxigênio. No forame, a mistura costuma vir com corticoide e anestésico local, combinação que deu mais sucesso que corticoide e anestésico sem ozônio num ensaio cego (Gallucci, Radiology 2007).',
    risco: 'Complicações graves são raras: a meta-análise de quase 8.000 pacientes estimou 0,064% (Steppan, J Vasc Interv Radiol 2010). Há relatos de embolia gasosa paradoxal por forame oval patente durante a injeção intradiscal, com infarto medular e do miocárdio (He, Front Neurol 2019) ou múltiplos infartos cerebrais (Khosravi, BMJ Neurol Open 2024), e de septicemia fatal após o tratamento (Gazzeri, Spine 2007); Discite e lesão da raiz são os riscos de toda punção discal.',
    evid: 'Na meta-análise de 12 estudos com quase 8.000 pacientes, a dor caiu em média 3,9 pontos e o ODI 25,7 pontos, com melhora na escala de MacNab em 79,7%, com critérios de inclusão amplos e primeiro autor ligado a uma empresa do ramo (Steppan, J Vasc Interv Radiol 2010). No ensaio cego com 159 pacientes, o sucesso em 6 meses foi de 74% com ozônio, corticoide e anestésico contra 47% sem ozônio (Gallucci, Radiology 2007); Num estudo prospectivo não randomizado, 47% dos tratados primeiro com ozônio precisaram de cirurgia em 2 anos, com dor e incapacidade semelhantes às de quem foi operado de início (Bisshopp, J Clin Med 2025).',
    pro: 'O gás que entra numa veia é a origem provável das embolias relatadas, por isso a injeção é lenta, sob imagem e com a ponta conferida antes de injetar, e o forame oval patente aparece nos casos de embolia paradoxal (Khosravi, BMJ Neurol Open 2024). O ensaio mais citado compara ozônio somado a corticoide com corticoide isolado, e não com simulação, por isso o efeito próprio do ozônio ainda é menos certo que os números das séries sugerem (Gallucci, Radiology 2007).'

    regiao: 'Lombar, sobretudo L4-L5 e acima, pelo triângulo de Kambin no forame; Em L5-S1 a crista ilíaca alta e o forame estreito atrapalham, e a via interlaminar costuma ser preferida.', nao: 'Hérnia L5-S1 central ou com crista ilíaca alta, e sequestro muito migrado: a via é a interlaminar. Estenose sem hérnia pede descompressão, endoscópica ou aberta.',

    alvo: 'O fragmento herniado no canal ou no forame L4-L5, alcançado pelo triângulo de Kambin, limitado pela raiz que sai (L4) acima e lateralmente, pela borda superior do corpo de L5 embaixo e pelo processo articular superior de L5 com a raiz que desce medialmente. A raiz L4 e seu gânglio ficam na borda do triângulo, por isso a cânula passa abaixo e medial a eles.',
    tec: 'Decúbito ventral ou lateral, anestesia local e sedação consciente, para que a pessoa avise se a raiz for tocada, e acesso posterolateral por incisão de cerca de 8 mm a 8 a 12 cm da linha média (Gadjradj, BMJ 2022). Na técnica de dentro para fora (inside-out), a cânula entra primeiro no disco e a hérnia é puxada de dentro; Na de fora para dentro (outside-in), brocas ou alargadores retiram a ponta e a face ventral do articular superior de L5 (foraminoplastia), o que alarga o forame e afasta o trajeto da raiz L4, e a cânula vai direto ao espaço epidural ventral. Sob endoscópio com irrigação contínua de soro, os fragmentos são retirados com pinças até a raiz L5 ficar livre.',

    evid: 'No ensaio de não inferioridade com 613 pacientes, a via endoscópica transforaminal não foi pior que a microdiscectomia e teve dor na perna 7,1 pontos menor em 100 aos 12 meses, diferença que pode não ser clinicamente relevante, além de alta no mesmo dia em 94% contra 6% (Gadjradj, BMJ 2022). Em ensaio anterior com 178 pacientes, os resultados clínicos foram iguais e a recidiva foi de 6,2%, sem diferença entre as técnicas (Ruetten, Spine 2008).',
    pro: 'A foraminoplastia do articular superior de L5 transforma o forame estreito numa porta segura, porque abre espaço abaixo da raiz L4 em vez de empurrar a cânula contra ela. A curva de aprendizado é real e a exposição à radiação é maior que na microdiscectomia (Gadjradj, BMJ 2022).'

    ind: 'Ciática por hérnia de disco L5-S1 com indicação cirúrgica, aqui à esquerda, sobretudo a hérnia central ou paramediana dentro do canal e a que migrou para cima ou para baixo do disco. Em L5-S1 a via transforaminal esbarra na crista ilíaca alta e no forame estreito, e o fragmento grande e migrado fica fora do alcance da cânula, enquanto a janela interlaminar larga desse nível dá acesso direto ao canal (Choi, Neurosurgery 2006).',

    regiao: 'Torácica e lombar, mais na transição toracolombar, em T12 e L1, onde se concentram as fraturas osteoporóticas; Na torácica alta e na cervical é raro e mais difícil.', nao: 'Fratura sem edema em STIR, já consolidada, ou parede posterior rota, pelo risco de cimento no canal. Dor lombar com Modic, sem fratura, aponta para a basivertebral.',
    ind: 'Fratura vertebral por compressão osteoporótica dolorosa e recente, com edema da medula óssea na RM (hipersinal em STIR) que mostra fratura não consolidada, e dor que não cede com analgesia. Também se usa em metástase ou mieloma com dor ou risco de colapso; Fratura sem edema em STIR já consolidou e não é alvo.',
    alvo: 'O osso esponjoso do corpo vertebral fraturado, do terço anterior ao médio, porque a dor vem do micromovimento da fratura e o cimento a estabiliza por dentro. A parede posterior precisa estar íntegra, pois é ela que separa o cimento do canal e da medula.',
    tec: 'Decúbito ventral, radioscopia biplanar ou TC, trocarte por via transpedicular uni ou bilateral, e em AP a ponta não pode cruzar a borda medial do pedículo antes de, no perfil, passar a parede posterior do corpo. A ponta para no terço anterior do corpo; Na cifoplastia um balão é inflado para criar uma cavidade e recuperar parte da altura antes do cimento. O cimento entra devagar sob fluoroscopia contínua em perfil, e a injeção para quando ele chega perto da parede posterior ou aparece numa veia.',
    inj: 'Polimetilmetacrilato (PMMA) viscoso com contraste radiopaco, em média 3 a 4 mL por vértebra (Venmans, AJNR 2008). Na cifoplastia o cimento, mais espesso, preenche a cavidade do balão com menos pressão.',
    risco: 'O vazamento de cimento ocorre em 41% das vértebras na vertebroplastia e em 9% na cifoplastia, quase sempre sem sintoma (Hulme, Spine 2006). Embolia pulmonar de cimento apareceu na TC de 26% dos tratados no VERTOS II, toda assintomática e ligada a vazamento para a veia ázigos (Venmans, AJNR 2010); Compressão medular ou radicular pelo cimento é rara, mas grave. Novas fraturas sintomáticas ocorreram em 9,5% contra 7,3% nos controles, diferença incerta (Buchbinder, Cochrane 2018).',
    evid: 'Os ensaios contra procedimento simulado de 2009 foram negativos (Buchbinder, NEJM 2009), inclusive o INVEST (Kallmes, NEJM 2009), e o VERTOS IV também não mostrou benefício em 12 meses (Firanescu, BMJ 2018). Os positivos são abertos e contra tratamento conservador: o VERTOS II deu 2,6 pontos a mais de queda da dor na escala de 0 a 10 em 1 mês (Klazen, Lancet 2010), e o FREE, com cifoplastia, 5,2 pontos a mais no componente físico do SF-36 em 1 mês (Wardlaw, Lancet 2009). A revisão Cochrane conclui que, contra simulação, não há benefício clinicamente importante (Buchbinder, Cochrane 2018).',
    pro: 'A exceção contra simulação é o VAPOUR, positivo em fraturas de menos de 6 semanas com enchimento amplo do corpo (Clark, Lancet 2016). O conjunto aponta forte efeito placebo e história natural favorável, por isso a RM com STIR é o filtro mínimo, e na metástase o mesmo trocarte permite biópsia antes do cimento.'
  },
  {
    id: 'biopsy', levels: ['L1', 'L2', 'L3'], cat: 4, name: 'Biópsia vertebral', lv: 'L2',
    mods: { lesions: DZ.find(d => d.id === 'mets').mods.lesions.filter(l => l.v === 'L2'), needles: [{ to: ['L2', 0.75, 0.3, -0.35], via: 'L2.ped.L', g: 11, len: 8.5, key: 'trocar.L', info: 'trocar', level: 'L2' }] },
    cam: { t: 'L2.canal', az: 0, el: -78, d: 16 }, show: 'bone disc neuro', clip: 'ax:L2', focus: ['L1', 'L2', 'L3'], hot: [],
    labels: [['tumor.L2', 'Lesão no corpo de L2'], ['trocar.L', 'Ponta na lesão'], ['trocar.L.meio', 'Trocarte pelo pedículo'], ['L2.ped.L', 'Pedículo de L2']],
    regiao: 'Qualquer nível, sobretudo torácico e lombar, por via transpedicular ou posterolateral; Na espondilodiscite, de preferência no disco ou na coleção paravertebral (Chang, AJR 2023).', nao: 'Lesão de aspecto típico e benigno na imagem, como o hemangioma comum, não pede biópsia. Com diagnóstico conhecido e dor por fratura, o tratamento é a vertebroplastia.',
    ind: 'Lesão vertebral de natureza incerta, como suspeita de metástase sem tumor primário conhecido, mieloma, linfoma ou tumor ósseo primário, ou espondilodiscite em que se precisa do germe para escolher o antibiótico. Aqui o alvo é o corpo de L2, e a biópsia vem antes de radioterapia ou quimioterapia, que alteram o tecido que o patologista precisa ver.',
    alvo: 'O corpo vertebral de L2 na parte viável da lesão, a que capta contraste, e não na área necrótica ou esclerótica pura. Na espondilodiscite o melhor alvo é o disco ou a coleção paravertebral: a sensibilidade microbiológica foi de 64,8% nessas amostras contra 45,5% no osso e na placa terminal (Chang, AJR 2023).',
    tec: 'Decúbito ventral, anestesia local até o periósteo e sedação, com trocarte por via transpedicular sob TC ou radioscopia biplanar, a mesma rota da vertebroplastia: em AP a ponta não cruza a borda medial do pedículo antes de, no perfil, passar a parede posterior do corpo. Pela cânula coaxial, uma agulha de corte ou trefina colhe vários cilindros de osso em direções diferentes sem trocar o ponto de entrada; A TC mostra melhor lesões pequenas e o canal, e a radioscopia é mais rápida e serve bem a lesões grandes do corpo lombar.',
    inj: 'Só anestésico local no trajeto, e o que se faz é retirar tecido: parte dos fragmentos vai em formol para histologia e imuno-histoquímica, e parte em frasco estéril sem formol para cultura de bactérias, micobactérias e fungos. Na suspeita de infecção também se colhem hemoculturas, e se há fratura patológica o mesmo trocarte pode levar o cimento depois da biópsia.',
    risco: 'Em 430 biópsias guiadas por TC houve 9 complicações, 5 paresias transitórias e 4 hematomas, nenhuma com consequência para o tratamento (Rimondi, Eur Spine J 2008). Os riscos são sangramento, maior em lesões muito vasculares como metástase renal ou de tireoide, lesão da raiz ou do saco dural se a cânula rompe a parede medial ou inferior do pedículo, e infecção.',
    evid: 'A biópsia por TC acertou o diagnóstico na primeira tentativa em 93,3% de 430 casos, com melhor acerto em tumores malignos primários e metastáticos e mais falso-negativos em lesões inflamatórias e benignas (Rimondi, Eur Spine J 2008). Na espondilodiscite a cultura é positiva em menos casos: a sensibilidade microbiológica agrupada foi de 46,6% (Chang, AJR 2023), e outra meta-análise achou sensibilidade de 52,2% com especificidade de 99,9% (Pupaibool, Spine J 2015).',
    pro: 'Antibiótico prévio não mudou de forma significativa a sensibilidade da cultura, 46,2% contra 44,6% (Chang, AJR 2023), por isso ele não impede a biópsia, mas uma biópsia negativa não afasta infecção (Pupaibool, Spine J 2015). Guia por TC ou por radioscopia teve sensibilidade microbiológica semelhante (Chang, AJR 2023), e o que pesa mais é a escolha do alvo.'
  },

    id: 'bvn', levels: ['L3', 'L4', 'L5', 'S'], cat: 4, name: 'Neurotomia do nervo basivertebral', lv: 'L4 e L5',
    mods: { bvn: ['L4.L', 'L5.L'], modic: ['L4-L5'], disc: { 'L4-L5': { h: 0.8, state: 'degen' } } },
    cam: { t: 'nuc.L4-L5', az: 55, el: 18, d: 22 }, show: 'bone disc neuro', hide: ['root.', 'drg.'], ghost: true, focus: ['L3', 'L4', 'L5', 'S'], hot: [],
    labels: [['bvn.L4', 'Nervo basivertebral de L4'], ['bvnrf.L5', 'Lesão de RF no terminal do nervo'], ['probe.L4', 'Cânula curva até o terminal'], ['intro.L4.meio', 'Introdutor pelo pedículo'], ['modic.L4', 'Placa com alteração de Modic']],
    regiao: 'Corpos vertebrais de L3 a S1, de cada lado da placa com Modic, como L4 e L5 para o disco L4-L5, com a sonda no centro do corpo por via transpedicular.', nao: 'Dor radicular, ou dor lombar sem Modic tipo 1 ou 2: o alvo é outro, como faceta ou disco (biacuplastia). Fratura recente com edema em STIR aponta para a vertebroplastia.',
    ind: 'Dor lombar axial crônica, há pelo menos 6 meses, sem resposta ao tratamento conservador, com alterações de Modic tipo 1 ou 2 nas placas terminais entre L3 e S1, o padrão chamado de dor vertebrogênica (Khalil, Spine J 2019). Aqui os alvos são os corpos de L4 e L5, vizinhos às placas com Modic no disco L4-L5; Dor radicular e outras causas evidentes de dor lombar não são alvo do procedimento.',
    alvo: 'O nervo basivertebral, que entra no corpo vertebral pelo forame vascular da parede posterior, junto com a veia basivertebral, e se ramifica no centro do corpo em direção às placas terminais superior e inferior, levando as fibras de dor da placa lesada (Michalik, Pain Med 2021). O alvo é o ponto em que o tronco se divide, no centro do corpo de L4 e no de L5, porque uma lesão ali desnerva as duas placas do mesmo corpo.',
    tec: 'Decúbito ventral, sedação ou anestesia geral e radioscopia em AP e perfil. Uma cânula entra pelo pedículo de L4, como numa vertebroplastia, e por dentro dela um estilete curvo abre um trajeto que vira para a linha média até o ponto de divisão do nervo; Por esse trajeto passa a sonda bipolar de radiofrequência, e o mesmo se repete em L5. A posição da ponta é conferida nas duas incidências antes de aquecer, longe da parede posterior e do canal.',
    inj: 'Não se injeta fármaco nem cimento: o tratamento é a energia térmica da radiofrequência, gerada entre os dois polos da sonda dentro do osso esponjoso, com anestesia local no trajeto. Como o calor fica no centro do corpo, longe da parede posterior, o canal e as raízes ficam fora da lesão, desde que a sonda não escape do osso.',
    risco: 'Os riscos são os da via transpedicular, como lesão da raiz se a cânula rompe a parede medial ou inferior do pedículo, fratura do pedículo ou do corpo, sangramento e infecção, além de lesão térmica se a sonda ficar perto da parede posterior. Os ensaios mediram sobretudo dor e função, e o efeito do calor sobre o osso tratado além de alguns anos ainda é pouco conhecido.',
    evid: 'No SMART, duplo-cego contra simulação com 225 pacientes, o ODI caiu 20,5 pontos com a ablação e 15,2 com a simulação em 3 meses, na análise por protocolo, e 75,6% contra 55,3% melhoraram pelo menos 10 pontos (Fischgrund, Eur Spine J 2018); No seguimento dos tratados, com 100 de 117 avaliados após média de 6,4 anos, o ODI foi de 42,8 para 16,9, 66% tinham mais de 50% de alívio e 34% estavam sem dor (Fischgrund, Eur Spine J 2020). No INTRACEPT, aberto contra tratamento padrão com 140 pacientes, a análise interina mostrou queda do ODI de 25,3 contra 4,4 pontos em 3 meses (Khalil, Spine J 2019), e a final, diferença de 20,3 pontos a favor da ablação em 3 meses e queda de 25,7 pontos em 12 meses, com 64% tendo pelo menos 50% de alívio e 29% sem dor (Smuck, Reg Anesth Pain Med 2021).',
    pro: 'Contra simulação, a diferença no SMART foi de cerca de 5 pontos de ODI, relatada na análise por protocolo, enquanto o ganho grande do INTRACEPT veio de um ensaio aberto contra tratamento padrão (Fischgrund, Eur Spine J 2018; Khalil, Spine J 2019). Todos os estudos até então foram financiados pela indústria, e a seleção por Modic tipo 1 ou 2 é o que define o candidato (Michalik, Pain Med 2021); A proporção em uso de opioide não mudou com a ablação em 12 meses (Smuck, Reg Anesth Pain Med 2021).'
  },
  {
    id: 'chemabl', levels: ['L2', 'L3', 'L4'], cat: 4, name: 'Ablação química de tumor e cisto', lv: 'Corpo de L3',
    mods: { needles: [{ to: ['L3', 0.75, 0.15, -0.1], via: 'L3.ped.L', g: 11, len: 8.5, key: 'trocar.L', info: 'trocar', level: 'L3' }],
      contrast: [{ at: ['L3', 0.4, 0.12, 0.42], r: [1.2, 0.9, 0.95], q: 'L3', lumpy: 0.12, kind: 'cyst', info: 'cyst', key: 'cyst', level: 'L3' }, { at: ['L3', 0.3, -0.05, 0.3], r: [0.98, 0.72, 0.78], q: 'L3', lumpy: 0.14, kind: 'sclero', info: 'sclero', key: 'sclero', level: 'L3' }] },
    cam: { t: 'L3', az: 70, el: 15, d: 20 }, show: 'bone disc', ghost: true, focus: ['L2', 'L3', 'L4'], hot: [],
    labels: [['cyst', 'Lesão cística no corpo de L3'], ['sclero', 'Esclerosante preenchendo a lesão'], ['trocar.L.meio', 'Agulha pelo pedículo'], ['L3.ped.L', 'Pedículo de L3']],
    regiao: 'Corpo vertebral e elementos posteriores, em qualquer região da coluna, com agulha guiada por imagem dentro das cavidades ou dos espaços vasculares da lesão.', nao: 'Déficit neurológico grave, instabilidade ou deformidade: a escolha é a cirurgia. Fratura osteoporótica ou metástase com dor pedem cimento (vertebroplastia), e não esclerosante.',
    ind: 'Cisto ósseo aneurismático da coluna sem déficit neurológico grave nem instabilidade, em que a injeção percutânea é opção de primeira linha (Liu, Global Spine J 2025), e hemangioma vertebral agressivo, que cresce para fora do corpo e comprime a medula ou a raiz (Doppman, Radiology 2000). A biópsia vem antes, para afastar tumor maligno com áreas de cisto aneurismático secundário (Hyde, J Craniovertebr Junction Spine 2026).',
    alvo: 'No cisto ósseo aneurismático, as cavidades cheias de sangue separadas por septos, com níveis líquido-líquido na RM, que costumam ocupar os elementos posteriores e invadir o corpo e o canal (Hyde, J Craniovertebr Junction Spine 2026). No hemangioma agressivo, os espaços vasculares do corpo vertebral e o componente epidural, mapeados por angiografia por TC antes da punção para dirigir a agulha às lacunas que recebem fluxo (Doppman, Radiology 2000).',
    tec: 'Agulha por via transpedicular ou posterolateral sob TC ou radioscopia, e contraste antes do agente, para ver se ele enche a cavidade ou foge rápido por veias de drenagem, como as epidurais. No cisto, o esclerosante é injetado em sessões repetidas até a cavidade ossificar, com média de 3 injeções por paciente com polidocanol (Rastogi, JBJS Br 2006) e de 2 a 14 sessões com doxiciclina (Shiels, Clin Orthop Relat Res 2013); No hemangioma, o etanol é injetado devagar dentro da lesão, sob controle de imagem.',
    inj: 'No cisto aneurismático, polidocanol a 3% (Rastogi, JBJS Br 2006) ou doxiciclina, às vezes em suspensão com albumina para ficar mais tempo na cavidade (Liu, Global Spine J 2025). No hemangioma, etanol absoluto, de 5 a 50 mL na série pioneira, cujos autores recomendam menos de 15 mL, porque os dois pacientes que receberam 42 e 50 mL tiveram fratura do corpo tratado (Doppman, Radiology 2000).',
    risco: 'O etanol necrosa o osso e o tecido vizinho: todos os 14 pacientes de uma série tiveram piora neurológica transitória após a ablação, um teve abscesso paravertebral e outro voltou a ter sintomas por colapso do corpo tratado (Goyal, AJNR 1999). Fratura patológica ocorreu nos que receberam os maiores volumes de etanol (Doppman, Radiology 2000), e a fuga do agente por veias de drenagem pode causar embolia e lesão de raiz ou medula; Com polidocanol, as complicações do ensaio randomizado foram menores e regrediram (Varshney, Clin Orthop Relat Res 2010).',
    evid: 'Em 72 cistos aneurismáticos tratados com polidocanol, a lesão reduziu em média 76,6%, 10 curaram com uma única injeção e a recidiva foi de 2,8% (Rastogi, JBJS Br 2006), e num ensaio com 94 pacientes randomizados a escleroterapia cicatrizou 93,3% contra 84,8% da curetagem com enxerto, com menos complicações (Varshney, Clin Orthop Relat Res 2010). Com doxiciclina, os 20 pacientes cicatrizaram e a recidiva foi de 5% após mais de 24 meses (Shiels, Clin Orthop Relat Res 2013); No hemangioma, o etanol obliterou as 11 lesões e 5 de 6 paraplégicos se recuperaram por completo (Doppman, Radiology 2000).',
    pro: 'Quase todos os dados do cisto vêm de séries com ossos longos e pelve, e na coluna as séries são pequenas: com doxiciclina e albumina, 14 cistos da coluna móvel encolheram sem recidiva nem complicação em seguimento médio de 68,1 meses (Liu, Global Spine J 2025). Déficit grave, instabilidade ou deformidade pedem cirurgia, que corrige rápido a compressão (Liu, Global Spine J 2025), e no hemangioma o volume de etanol é o que mais pesa no risco de colapso (Doppman, Radiology 2000).'
  },

    mods: { disc: { 'L4-L5': { discectomy: true } }, cage: { at: 'L4-L5', side: 'L' }, screws: ['L4.L', 'L4.R', 'L5.L', 'L5.R'], facetectomy: ['L4-L5.L'] },
    cam: { t: 'cage', az: 115, el: 22, d: 30 }, show: 'bone disc', ghost: true, ax: 'L4-L5', focus: ['L3', 'L4', 'L5', 'S'], hot: [],
    labels: [['cage', 'Cage no espaço discal'], ['screw.L4.L', 'Parafuso pedicular de L4'], ['screw.L5.L', 'Parafuso pedicular de L5'], ['rod.L', 'Haste'], ['fxt.L4-L5.L', 'Faceta retirada (acesso)']],
    regiao: 'Lombar, mais em L4-L5 e L5-S1, com cage no disco do segmento instável, por facetectomia de um lado, e parafusos pediculares.', nao: 'Estenose com listese de baixo grau sem instabilidade: a descompressão isolada não foi inferior à fusão (Austevoll, NEJM 2021). Dor lombar pura por discopatia só em casos muito selecionados.',
    ind: 'Espondilolistese degenerativa ou ístmica com instabilidade dinâmica e dor radicular ou claudicação, estenose cuja descompressão desestabiliza o segmento, recidiva de hérnia no mesmo nível e, em casos muito selecionados, discopatia com dor lombar. A fusão intersomática soma à descompressão a restauração da altura do disco e do forame e o apoio da coluna anterior.',
    alvo: 'O espaço discal do segmento instável, por exemplo L4-L5, acessado no triângulo entre a raiz que sai (L4), a raiz que desce (L5) e o saco dural. A coluna anterior carrega a maior parte da carga axial, por isso o cage com enxerto no disco consolida sob compressão e devolve altura ao forame, descomprimindo a raiz de forma indireta.',
    tec: 'Decúbito ventral, acesso posterior mediano ou paramediano minimamente invasivo, com parafusos pediculares guiados por radioscopia ou navegação por TC. No TLIF retira-se toda a faceta de um lado e o disco é abordado pelo forame, lateral ao saco dural, quase sem retraí-lo; No PLIF a laminectomia é bilateral e o disco é abordado dos dois lados do canal, afastando a dura e a raiz para a linha média. Após discectomia e preparo das placas terminais, o cage é colocado sob radioscopia em AP e perfil e as hastes comprimem o segmento sobre ele.',
    inj: 'Cage de PEEK ou titânio cheio de enxerto ósseo autólogo, em geral o osso local da laminectomia e da faceta, às vezes crista ilíaca ou substitutos, mais parafusos pediculares em cada vértebra ligados por duas hastes. No PLIF costumam ser dois cages, um de cada lado; No TLIF, um cage oblíquo ou curvo levado à parte anterior do disco.',
    risco: 'Numa meta-análise de espondilolistese, as complicações somaram 8,7% no TLIF e 17,0% no PLIF (de Kunder, Spine J 2017), e o TLIF teve menos lesão de raiz e menos rotura dural (Lan, World Neurosurg 2018). Outros riscos são parafuso mal posicionado, infecção, migração do cage e pseudoartrose. A doença do segmento adjacente que exigiu nova cirurgia chegou a 16,5% em 5 anos e 36,1% em 10 anos após artrodese posterior (Ghiselli, JBJS 2004).',
    evid: 'No SLIP, em listese degenerativa grau I, somar fusão posterolateral instrumentada à laminectomia deu 5,7 pontos a mais no SF-36 físico em 2 anos, sem diferença no ODI, e menos reoperação (14% contra 34%) (Ghogawala, NEJM 2016). No estudo sueco, com 247 pacientes com estenose, pouco mais da metade com listese, a fusão não melhorou o ODI em 2 e 5 anos, alongou a internação (7,4 contra 4,1 dias) e não reduziu reoperação (22% contra 21%) (Försth, NEJM 2016). TLIF e PLIF têm taxa de fusão e satisfação semelhantes (Lan, World Neurosurg 2018); Nenhum dos dois ensaios grandes testou o cage, e sim a fusão em si.',
    pro: 'No TLIF, a facetectomia completa de um lado expõe o triângulo entre a raiz que sai, a que desce e a dura, por onde se entra no disco sem afastar o saco. Cage bem anterior e compressão das hastes sobre ele ajudam a recuperar a lordose do segmento.'
  },
  {

    cam: { t: 'adr', az: 90, el: 4, d: 11 }, show: 'bone disc neuro', clip: 'sag', focus: ['C4', 'C5', 'C6', 'C7'], hot: [],
    labels: [['adr.core', 'Núcleo de polietileno'], ['adr.plate', 'Placas metálicas'], ['adr.keel', 'Quilha no corpo de C5'], ['adr.ann', 'Anel posterior que restou'], ['cord', 'Medula']],
    regiao: 'Cervical subaxial, mais em C5-C6 e C6-C7, por via anterior; A prótese discal lombar existe, mas é bem menos usada.', nao: 'Instabilidade, cifose fixa, artrose facetária, osteoporose grave, ossificação do ligamento longitudinal posterior ou compressão posterior: a escolha é a artrodese anterior (ACDF) ou a via posterior.',
    ind: 'Radiculopatia ou mielopatia cervical por hérnia de disco ou osteófito discal em 1 ou 2 níveis, aqui C5-C6, que não cedeu com tratamento conservador ou tem déficit progressivo. O segmento precisa ter movimento, sem instabilidade, sem cifose fixa e sem artrose facetária importante, e ficam de fora osteoporose grave, ossificação do ligamento longitudinal posterior e compressão que vem de trás.',
    alvo: 'O disco C5-C6 inteiro, retirado pela frente, com descompressão da medula e das raízes C6 nos dois forames. Em vez de fundir o segmento como na artrodese (ACDF), a prótese ocupa o espaço do disco e mantém o movimento, com a hipótese de poupar os discos vizinhos da sobrecarga.',
    tec: 'Decúbito dorsal com o pescoço em posição neutra e via anterior de Smith-Robinson: incisão transversa e plano entre a bainha carotídea, lateral, e traqueia e esôfago, mediais, até a coluna, com afastamento do longo do pescoço. Com distração do espaço, faz-se a discectomia completa, a retirada do ligamento longitudinal posterior e dos osteófitos e a foraminotomia dos dois lados; As placas terminais são preparadas sem retirar o osso cortical, e a prótese é escolhida para cobrir a maior área da placa e centrada na linha média sob radioscopia em AP e perfil.',
