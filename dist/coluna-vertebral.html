<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coluna Vertebral 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: estação de leitura. Roteiro da aula e modelo 3D lado a lado; no celular o texto lidera e o 3D é chamado sob demanda. */
:root {
  --paper: #EEF1F0;
  --panel: #FFFFFF;
  --ink: #18221F;
  --ink-2: #3F4B49;
  --ink-3: #5F6B68;
  --line: #D6DEDB;
  --line-strong: #8E9A97;
  --accent: #0D6669;
  --accent-soft: #E1EFEE;
  --sel: #127E83;
  --path: #B5432B;
  --path-soft: #F8E9E4;
  --lightbox-a: #F6F8F8;
  --lightbox-b: #DCE5E4;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16.5px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.top { display: flex; align-items: center; gap: 20px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.brand h1 { font-weight: 700; font-size: 20px; margin: 0; }
.seg { display: inline-flex; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14.5px; color: var(--ink-2); min-height: 34px; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(20,40,40,.14); }
.seg button.dz[aria-pressed="true"] { color: var(--path); }
.prog { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.prog .bar { width: 110px; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.prog .bar i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left center; transform: scaleX(0); transition: transform .4s; }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) 0 var(--pw, 430px); grid-template-areas: "view split panel"; min-height: 0; }
.panel { grid-area: panel; }
/* divisória: área de toque de 12px sobre a borda do painel, alça visível no meio */
.split { grid-area: split; position: relative; z-index: 7; }
.split::before { content: ""; position: absolute; top: 0; bottom: 0; left: -6px; width: 12px; cursor: col-resize; touch-action: none; }
.split::after { content: ""; position: absolute; top: 50%; left: -3px; width: 6px; height: 44px; margin-top: -22px; border-radius: 3px; background: var(--ink-3); transition: background-color .15s; pointer-events: none; }
.split:hover::after, .split:focus-visible::after, .split.drag::after { background: var(--accent); }
.split:focus-visible { outline: none; }
body.resizing { cursor: col-resize; user-select: none; }
.view { grid-area: view; position: relative; min-height: 0; background: radial-gradient(120% 90% at 40% 35%, var(--lightbox-a), var(--lightbox-b)); overflow: hidden; }
.view::after { content: ""; position: absolute; inset: 0; background: rgba(24,34,31,.14); opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 0; }
.view.dim::after { opacity: 1; }
#gl { position: absolute; z-index: 1; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#gl:active { cursor: grabbing; }
.loading { z-index: 5; position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; color: var(--ink-2); pointer-events: none; }
.fail { z-index: 6; position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
.fail p { max-width: 36ch; margin: 0 0 12px; color: var(--ink-2); }

/* rótulos */
#labels { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
#labels svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.lbl { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; white-space: nowrap; font-size: 14px; font-weight: 600; line-height: 1; padding: 5px 8px; border-radius: 5px; background: rgba(255,255,255,.94); border: 1px solid var(--line); color: var(--ink); box-shadow: 0 1px 3px rgba(20,40,40,.1); }
.lbl.hot { border-color: var(--path); color: var(--path); }
.lbl.sel { background: var(--sel); border-color: var(--sel); color: #fff; }
.lbl:hover { border-color: var(--accent); }

/* ferramentas sobre o 3D */
.ttog { z-index: 3; position: absolute; left: 12px; top: 12px; border: 1px solid var(--line-strong); background: rgba(255,255,255,.95); border-radius: 8px; padding: 6px 12px; font-size: 14.5px; font-weight: 600; cursor: pointer; min-height: 36px; }
.ttog[aria-expanded="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.tools { z-index: 3; position: absolute; left: 12px; right: 64px; top: 56px; display: none; flex-wrap: wrap; gap: 6px; align-items: flex-start; }
.tools.open { display: flex; }
.group { display: flex; flex-wrap: wrap; gap: 4px; background: rgba(255,255,255,.95); border: 1px solid var(--line); border-radius: 8px; padding: 4px; }
.chip { border: 1px solid transparent; background: transparent; border-radius: 5px; padding: 4px 9px; font-size: 14px; cursor: pointer; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; min-height: 32px; }
.chip .sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; opacity: .35; }
.chip[aria-pressed="true"] { background: var(--panel); border-color: var(--line-strong); color: var(--ink); }
.chip[aria-pressed="true"] .sw { opacity: 1; }
.chip:hover { color: var(--ink); }
.lvsel { display: none; }
.hint { z-index: 2; position: absolute; left: 12px; bottom: 10px; font-size: 14px; color: var(--ink-2); pointer-events: none; background: rgba(246,248,248,.85); padding: 2px 6px; border-radius: 4px; }
.explore, .done3d { display: none; }

/* sobre o modelo: no topo, comparar e localizar; embaixo, camadas e cortes. Mesma faixa horizontal
   (12 px da borda esquerda até a régua), tudo centralizado, controles com 44 px de altura */
.viewtop { z-index: 3; position: absolute; left: 12px; right: 68px; top: 12px; display: flex; flex-wrap: wrap; justify-content: center; align-items: stretch; gap: 8px; pointer-events: none; }
.viewtop:empty { display: none; }
.viewtop > * { pointer-events: auto; }
.viewtop .dzbar { margin: 0; display: flex; }
.viewtop .seg { box-sizing: border-box; height: 44px; align-items: stretch; background: rgba(238,241,240,.96); box-shadow: 0 1px 4px rgba(20,40,40,.08); }
.viewtop .seg { flex: 0 0 auto; }
.viewtop .seg button { min-height: 0; padding: 0 16px; font-size: 15px; white-space: nowrap; }
.viewtop .see { margin: 0; box-sizing: border-box; min-height: 44px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0 14px; padding: 4px 16px; background: rgba(255,255,255,.96); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 1px 4px rgba(20,40,40,.08); }
.viewtop .see .h { margin: 0; font-size: 14px; color: var(--ink-3); }
.viewtop .see .row { gap: 0 14px; justify-content: center; }
.viewtop .see button { padding: 0; min-height: 34px; font-size: 15px; }
@media (min-width: 901px) {
  .ttog, .hint { display: none; }
  /* grade de uma coluna: as duas linhas (camadas, cortes) ficam com a mesma largura e centralizadas */
  .tools { display: grid; grid-template-columns: minmax(0, max-content); justify-content: center; top: auto; bottom: 12px; left: 12px; right: 68px; gap: 6px; pointer-events: none; }
  .tools .group { justify-content: center; pointer-events: auto; box-shadow: 0 1px 4px rgba(20,40,40,.08); }
  .view .info { bottom: calc(var(--dock-h, 90px) + 24px); }
}

/* régua de níveis */
.ruler { z-index: 3; position: absolute; right: 12px; top: 12px; bottom: 12px; width: 44px; display: flex; flex-direction: column; background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 8px; padding: 4px 0; overflow-y: auto; scrollbar-width: none; }
.ruler::-webkit-scrollbar { display: none; }
.ruler button { flex: 1 1 0; min-height: 14px; border: 0; background: transparent; font-size: 12px; font-weight: 600; color: var(--ink-2); cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; padding: 0; font-variant-numeric: tabular-nums; }
.ruler button::before { content: ""; position: absolute; left: 3px; top: 15%; bottom: 15%; width: 3px; border-radius: 2px; background: var(--rc); opacity: .6; }
.ruler button:hover, .ruler button.on { color: var(--ink); background: var(--accent-soft); }
.ruler button.on { font-weight: 700; }
.ruler.short { bottom: auto; max-height: calc(100% - 24px); }
.ruler.short button { flex: 0 0 34px; }
.ruler button[hidden] { display: none; }
.ruler.short::before { content: "Níveis"; display: block; font-size: 11px; font-weight: 600; color: var(--ink-3); text-align: center; padding: 2px 0 4px; }

/* cartão de estrutura */
.info { z-index: 4; position: absolute; left: 12px; bottom: 40px; width: min(340px, calc(100% - 80px)); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px; padding: 12px 14px; box-shadow: 0 2px 8px rgba(20,40,40,.1); }
.info h3 { margin: 0 0 4px; font-size: 18px; font-weight: 700; padding-right: 28px; text-wrap: balance; }
.info .meta { font-size: 14px; color: var(--ink-3); margin-bottom: 6px; }
.info p { margin: 0; font-size: 15px; color: var(--ink-2); }
.info ul { margin: 6px 0 0; padding-left: 16px; font-size: 14.5px; color: var(--ink-2); }
.info .note { margin-top: 6px; font-size: 13.5px; color: var(--ink-3); }
.info .x { position: absolute; right: 6px; top: 6px; border: 0; background: transparent; cursor: pointer; font-size: 20px; line-height: 1; color: var(--ink-3); width: 32px; height: 32px; border-radius: 6px; }
.info .x:hover { background: var(--paper); color: var(--ink); }
.info .acts { margin-top: 10px; display: flex; gap: 6px; }

/* painel */
.panel { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.chapwrap { position: relative; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
.chapwrap::before, .chapwrap::after { content: ""; position: absolute; top: 0; bottom: 0; width: 34px; pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 1; }
.chapwrap::before { left: 0; background: linear-gradient(to right, var(--panel), rgba(255,255,255,0)); }
.chapwrap::after { right: 0; background: linear-gradient(to left, var(--panel), rgba(255,255,255,0)); }
.chapwrap.more-l::before, .chapwrap.more-r::after { opacity: 1; }
.chap { display: flex; gap: 4px; padding: 10px 14px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; scroll-behavior: smooth; }
.chap::-webkit-scrollbar { display: none; }
.chap button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px; font-size: 14px; cursor: pointer; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; min-height: 34px; }
.chap button b { font-weight: 700; font-size: 13px; color: var(--ink-3); }
.chap button[aria-current="step"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.chap button[aria-current="step"] b { color: #B9C7C4; }
.chap button.done:not([aria-current="step"])::after { content: "✓"; color: var(--accent); font-weight: 700; }
.scroll { flex: 1 1 auto; overflow-y: auto; padding: 20px 22px 24px; min-height: 0; }
.eyebrow { font-size: 14px; color: var(--ink-3); }
.scroll h2 { font-weight: 700; font-size: 26px; line-height: 1.2; margin: 4px 0 14px; text-wrap: balance; }
.scroll h2:focus { outline: none; }
.scroll p { margin: 0 0 12px; max-width: 62ch; }
.how { font-size: 15px; color: var(--ink-2); padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.how b { color: var(--ink); }
.pro { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line); }
.pro .h { font-weight: 700; font-size: 16px; color: var(--accent); margin-bottom: 4px; }
.pro p { margin: 0; }
.see { margin-top: 18px; }
.see .h { font-size: 14px; color: var(--ink-3); margin-bottom: 2px; }
.see .row { display: flex; flex-wrap: wrap; gap: 0 18px; }
.see button { border: 0; background: none; padding: 7px 0; min-height: 36px; font-size: 15.5px; cursor: pointer; color: var(--accent); text-decoration: underline; text-decoration-color: rgba(13,102,105,.4); text-underline-offset: 3px; }
.see button:hover { text-decoration-color: var(--accent); }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--panel); }
.btn { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 8px; padding: 8px 16px; cursor: pointer; font-weight: 600; font-size: 15px; min-height: 42px; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { background: #0A5558; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.sm { padding: 5px 12px; font-size: 14px; min-height: 36px; }
.btn.link { border-color: transparent; background: none; color: var(--accent); padding-left: 0; }

/* gráfico Wilke */
.bars { margin: 14px 0 4px; display: grid; gap: 7px; }
.bars .r { display: grid; grid-template-columns: 170px minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-size: 14.5px; }
.bars .t { height: 12px; border-radius: 3px; overflow: hidden; }
.bars .t i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bars .v { font-size: 14px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.bars .note { font-size: 13.5px; color: var(--ink-3); }

/* quiz */
.q { padding: 4px 0 18px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.q .qt { font-weight: 600; margin-bottom: 10px; }
.q .opts { display: grid; gap: 6px; }
.q .opts button { text-align: left; border: 1px solid var(--line-strong); background: var(--panel); border-radius: 7px; padding: 9px 12px; cursor: pointer; font-size: 15.5px; min-height: 44px; }
.q .opts button:hover:not(:disabled) { border-color: var(--accent); }
.q .opts button.ok { border-color: var(--accent); background: var(--accent-soft); }
.q .opts button.no { border-color: var(--path); background: var(--path-soft); }
.q .opts button:disabled { cursor: default; }
.q .ex { margin-top: 8px; font-size: 15px; color: var(--ink-2); }
.qfoot { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.score { font-size: 15px; font-weight: 600; color: var(--accent); }

/* doenças */
.dzcat { margin: 26px 0 4px; font-size: 18px; font-weight: 700; color: var(--ink); }
.dzcat:first-child { margin-top: 0; }
.dzlist { display: grid; }
.dzi { display: flex; justify-content: space-between; gap: 12px; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 11px 2px; cursor: pointer; align-items: baseline; min-height: 44px; }
.dzi:hover span { color: var(--path); }
.dzi span { font-weight: 600; }
.dzi em { font-style: normal; font-size: 14px; color: var(--ink-3); white-space: nowrap; }
.dzi.seen span::after { content: " ✓"; color: var(--accent); font-weight: 400; }
.others { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
.others summary { cursor: pointer; font-weight: 600; min-height: 32px; }
.others dl { margin: 10px 0 0; }
.others dt { font-weight: 600; font-size: 15px; margin-top: 8px; }
.others dd { margin: 2px 0 0; font-size: 15px; color: var(--ink-2); }
.back { border: 0; background: transparent; cursor: pointer; color: var(--ink-2); padding: 6px 0; font-size: 15px; margin-bottom: 6px; min-height: 36px; }
.back:hover { color: var(--ink); }
.lvtag { font-size: 15px; color: var(--path); font-weight: 600; margin: -6px 0 12px; }
.dzbar { margin: 0 0 16px; }
.sec { margin-top: 16px; }
.sec h3 { margin: 0 0 2px; font-size: 16.5px; font-weight: 700; color: var(--ink); }
.sec p { margin: 0; }
.donebox { margin: 0 0 20px; padding: 0 0 16px; border-bottom: 1px solid var(--line); }
.donebox strong { color: var(--accent); }

@media (max-width: 900px) {
  html, body { height: auto; }
  #app { height: auto; display: block; }
  .stage { display: flex; flex-direction: column; }
  .view { order: 1; height: 44svh; min-height: 300px; }
  .panel { order: 2; border-left: 0; border-top: 1px solid var(--line); }
  #gl { touch-action: pan-y; cursor: default; }
  .scroll { overflow: visible; padding: 18px 16px; }
  .nav { position: sticky; bottom: 0; z-index: 7; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  .prog { margin-left: 0; width: 100%; }
  .prog .bar { flex: 1; width: auto; }
  .top { padding: 8px 16px; gap: 8px 12px; }
  .ttog { top: auto; bottom: 12px; left: 12px; }
  .tools { top: auto; bottom: 58px; right: 12px; }
  .chip { padding: 6px 9px; min-height: 40px; }
  .seg button, .chap button { min-height: 40px; }
  .lvsel { display: block; min-height: 40px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 8px; background: var(--panel); }
  .ruler, .hint, .split { display: none; }
  .viewtop { left: 8px; right: 8px; top: 8px; flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scrollbar-width: none; }
  .viewtop::-webkit-scrollbar { display: none; }
  .viewtop .see, .viewtop .see .row { flex-wrap: nowrap; white-space: nowrap; justify-content: flex-start; }
  .viewtop .see { flex: 0 0 auto; }
  .viewtop .see .h { display: none; }
  .view.full .viewtop { top: calc(56px + env(safe-area-inset-top, 0px)); }
  .explore { display: block; position: absolute; z-index: 3; right: 12px; bottom: 12px; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 15px; cursor: pointer; min-height: 40px; }
  .info { position: fixed; left: 8px; right: 8px; width: auto; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); max-height: 36svh; overflow-y: auto; z-index: 8; }
  .bars .r { grid-template-columns: 110px minmax(0, 1fr) 68px; font-size: 13.5px; }
  /* modo explorar: 3D em tela cheia com gestos */
  .view.full { position: fixed; inset: 0; height: 100%; min-height: 0; z-index: 20; }
  .view.full #gl { touch-action: none; }
  .view.full .explore { display: none; }
  .view.full .done3d { display: block; position: absolute; z-index: 3; right: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); border: 1px solid var(--ink); background: var(--ink); color: #fff; border-radius: 8px; padding: 8px 16px; font-weight: 600; font-size: 15px; min-height: 40px; cursor: pointer; }
  .view.full .ttog { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  .view.full .info { bottom: calc(60px + env(safe-area-inset-bottom, 0px)); z-index: 21; }
  .view.full .gesture { display: block; }
}
.gesture { display: none; position: absolute; z-index: 3; left: 12px; right: 130px; top: calc(12px + env(safe-area-inset-top, 0px)); font-size: 14px; line-height: 1.35; color: var(--ink-2); background: rgba(255,255,255,.92); padding: 5px 9px; border-radius: 6px; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<div id="app">
  <header class="top">
    <div class="brand"><h1>Coluna vertebral</h1></div>
    <div class="seg" role="group" aria-label="Parte da aula">
      <button id="m-anat" aria-pressed="true">Anatomia</button>
      <button id="m-dz" aria-pressed="false">Doenças</button>
    </div>
    <div class="prog"><span id="progtxt"></span><span class="bar" aria-hidden="true"><i id="progbar"></i></span></div>
  </header>
  <main class="stage">
    <aside class="panel" id="panel" aria-label="Aula">
      <div class="chapwrap" id="chapwrap"><nav class="chap" id="chap" aria-label="Capítulos"></nav></div>
      <div class="scroll" id="scroll"></div>
      <div class="nav" id="nav"></div>
    </aside>
    <div class="split" id="split" role="separator" tabindex="0" aria-orientation="vertical" aria-controls="panel" aria-label="Largura do texto" aria-valuemin="320" title="Arraste para mudar a largura do texto; clique duplo volta ao padrão"></div>
    <section class="view" id="view" aria-label="Modelo 3D da coluna">
      <canvas id="gl" role="img" aria-label="Modelo 3D da coluna vertebral. Use os links Localizar no 3D do painel para destacar estruturas."></canvas>
      <div id="labels" aria-hidden="true"><svg id="lines"></svg></div>
      <div class="gesture">Um dedo gira, pinça aproxima, dois dedos movem</div>
      <button class="done3d" id="done3d" type="button">Concluir</button>
      <button class="ttog" id="ttog" type="button" aria-expanded="false" aria-controls="tools">Camadas e cortes</button>
      <div class="tools" id="tools">
        <div class="group" id="layers" role="group" aria-label="Camadas"></div>
        <div class="group" id="viewtools" role="group" aria-label="Visualização"></div>
      </div>
      <nav class="ruler" id="ruler" aria-label="Ir para um nível da coluna"></nav>

/* contorno do corpo vertebral (seção axial) */

  /* ---- vértebras ---- */
  const VP = {}; // pontos locais úteis por vértebra
  const rings = {}; // anéis de placa terminal em coordenadas de mundo

    const l = LEVELS[i], fr = F[l.n];
    const g = new THREE.Group(); g.position.copy(fr.p); g.quaternion.copy(fr.q); root.add(g);
    const part = (geo, kind, key, info) => { const m = add(geo, kind, key, info, { level: l.n, region: l.r }); g.add(m); return m; };
    const S = [1, -1]; const sd = s => s > 0 ? 'L' : 'R';
    const h = fr.h, widen = md('widen', l.n, 1), W = l.W * widen, D = fr.Dw, w = fr.w;

  function buildC1(part, l, P, S, sd) {

  }

  function buildCervical(part, l, P, S, sd, h, W, D, dA, dB, fr) {
    const isC2 = l.n === 'C2', isC7 = l.n === 'C7';
    const lmx = l.cw / 2 + 0.42, lmz = -D / 2 - 0.62;
    P.sap = {}; P.iap = {};
    S.forEach(s => {
      const side = sd(s);

      part(rod(v(s * W * 0.36, 0.05, -D / 2 + 0.3), v(s * (lmx - 0.15), 0.0, lmz + 0.25), 0.27, { f: 1.2 }), 'bone', `${l.n}.ped.${side}`, 'pedicle');

        part(rod(v(s * (lmx + 0.2), -0.05, lmz + 0.1), v(s * (fx + 0.55), -0.12, fz - 0.42), 0.16, { r2: 0.22 }), 'bone', `${l.n}.tp.${side}`, 'tp');

  }

  function buildThoracic(part, l, P, S, sd, h, W, D, dA, dB) {
    const k = +l.n.slice(1);
    const py = 0.12 * h, zP = -D / 2 - l.pl;
    P.sap = {}; P.iap = {}; P.tpTip = {};
    S.forEach(s => {
      const side = sd(s), px = l.px;

      part(rod(sapB, sapT, 0.4, { f: 0.5, side: v(0, 0, 1) }), 'bone', `${l.n}.sap.${side}`, 'sap');
      const iapT = v(s * (px - 0.1), -0.25 * h, zP - 0.62), iapB = v(s * (px - 0.1), -h / 2 - dB * 0.8, zP - 0.62);

    });

    part(mergeGeoms([rod(root_, tip, 0.42, { r2: 0.28, f: 0.55 }), ellip(tip, 0.32, 0.36, 0.3)]), 'bone', `${l.n}.sp`, 'spinous');
    P.spRoot = root_; P.spTip = tip; P.spR = 0.4;
  }

  function buildLumbar(part, l, P, S, sd, h, W, D, dA, dB) {
    const k = +l.n.slice(1);
    const py = 0.12 * h, zP = -D / 2 - l.pl;
    P.sap = {}; P.iap = {}; P.tpTip = {};
    const fh = mods.facet || {};
    S.forEach(s => {
      const side = sd(s), px = l.px;
      part(rod(v(s * px, py, -D / 2 + 0.35), v(s * px, py, zP), l.pw / 2 + 0.08, { f: (l.pw / 2 + 0.08) / (l.ph / 2), side: v(1, 0, 0) }), 'bone', `${l.n}.ped.${side}`, 'pedicle');

      if (mods.pars && mods.pars.includes(l.n)) {

      P.sap[side] = { top: sapT }; P.iap[side] = { bot: iapB };
    });

  }

  /* ---- sacro ---- */
  {
    const Wt = [10.6, 10.0, 7.6, 5.6, 4.0, 2.6], T = [4.8, 4.6, 3.8, 3.0, 2.3, 1.6], za = [1.65, 1.45, 1.15, 0.95, 0.75, 0.6];
    const N = 44; const rr = [], LR = [];
    const frontZ = (j, x) => { const f = LR[j].filter(p => p[2] > 0).sort((a, b) => a[0] - b[0]); for (let i = 0; i < f.length - 1; i++) if (x >= f[i][0] && x <= f[i + 1][0]) { const t = (x - f[i][0]) / (f[i + 1][0] - f[i][0] || 1); return f[i][1] + (f[i + 1][1] - f[i][1]) * t; } return f[0][1]; };
    for (let j = 0; j < 6; j++) {
      const bw = SD[Math.min(j, 4)][0] / 2, ring = [], loc = [];
      for (let i = 0; i < N; i++) {
        const t = 2 * Math.PI * i / N, s = Math.sin(t), c = Math.cos(t);
        const x = Wt[j] / 2 * Math.sign(s) * Math.pow(Math.abs(s), 2 / 2.6);

      }

    // corpo de S1 (platô)
    const g = new THREE.Group(); g.position.copy(SB[0].p); g.quaternion.copy(SB[0].q); root.add(g);
    const ol = bodyOutline('L', 4.9, 3.3, 40);
    const lev = [[-1.3, 0.97], [-0.4, 0.99], [-0.06, 1.0], [0, 0.96]];
    const r2 = lev.map(([y, s]) => ol.map(([x, z]) => v(x * s, y, z * s)));

    anchors.set('ala.L', toW(SB[0], 4.0, -0.9, 0.2));
    anchors.set('S1.endplate', toW(SB[0], 0, 0, 0.2));
    // processos articulares superiores de S1
    [1, -1].forEach(s => {
      const side = s > 0 ? 'L' : 'R';
      const m = add(rod(v(s * 2.35, -0.4, -2.55), v(s * 2.5, 1.05, -2.75), 0.55, { f: 0.62, side: v(1, 0, 0.35) }), 'bone', 'S1.sap.' + side, 'sap', { level: 'S', region: 'S' }); g.add(m);

    az.push(SPf('T4', s => [-1.0, 0.4, s.D / 2 + 1.6]), SPf('T4', s => [-0.9, 1.2, s.D / 2 + 3.3]), SPf('T3', s => [-1.3, 0.6, s.D / 2 + 4.9]));
    VS('azygos', 'vein', az, () => 0.38, 'azygos');
    anchors.set('azygos', SPf('T7', s => [-1.15, 0, s.D / 2 + 0.45]));
    const hz = [SPf('L1', s => [1.0, 0, s.D / 2 + 0.2]), SPf('T12', s => [1.05, 0, s.D / 2 + 0.22]), SPf('T11', s => [1.05, 0, s.D / 2 + 0.24]), SPf('T10', s => [0.95, 0, s.D / 2 + 0.25]), SPf('T9', s => [0.2, -0.2, s.D / 2 + 0.3]), SPf('T9', s => [-0.9, 0.3, s.D / 2 + 0.42])];
    VS('hemiaz', 'vein', hz, () => 0.26, 'hemiaz');
    anchors.set('hemiaz', SPf('T11', s => [1.05, 0, s.D / 2 + 0.24]));
    // plexo vertebral interno (Batson)
    const pl = [[], []], pp = [[], []];
    for (let u = KI.C2; u <= KI.S1 + 0.01; u += 0.5) {
      const s = spineAt(u);
      [1, -1].forEach((sg, i) => {
        pl[i].push(s.p.clone().add(v(sg * s.cw * 0.3, 0, s.post - 0.2).applyQuaternion(s.q)));
        pp[i].push(s.p.clone().add(v(sg * s.cw * 0.2, 0, s.zc - s.ca / 2 + 0.16).applyQuaternion(s.q)));
      });
    }
    VS('plex.ant.L', 'vein', pl[0], () => 0.075, 'plexus'); VS('plex.ant.R', 'vein', pl[1], () => 0.075, 'plexus');
    VS('plex.post.L', 'vein', pp[0], () => 0.06, 'plexus'); VS('plex.post.R', 'vein', pp[1], () => 0.06, 'plexus');
    for (let i = 2; i < 24; i++) {
      const n = LEVELS[i].n, s = spineAt(KI[n]);
      const a = s.p.clone().add(v(s.cw * 0.3, 0, s.post - 0.2).applyQuaternion(s.q)), b = s.p.clone().add(v(-s.cw * 0.3, 0, s.post - 0.2).applyQuaternion(s.q)), c = s.p.clone().add(v(0, 0, s.post - 0.14).applyQuaternion(s.q)), d = s.p.clone().add(v(0, 0, s.post + 0.75).applyQuaternion(s.q));
      VS(`plex.rung.${n}`, 'vein', [a, c, b], () => 0.06, 'plexus', { level: n });
      VS(`bvv.${n}`, 'vein', [c, d], () => 0.07, 'bvv', { level: n });
    }
    anchors.set('plexus', SPf('L2', s => [s.cw * 0.3, 0, s.post - 0.2]));
    anchors.set('bvv', SPf('L2', s => [0, 0, s.post + 0.4]));
  }

  /* ---- lesões e achados específicos ---- */
  if (mods.synd) {
    const g = [];
    Object.keys(DISCS).forEach(dn => {
      if (DISCS[dn].up === 'C2') return;
      const { lower, upper } = discRings(dn);
      [0, 5, 35, 9, 31, 3, 37].forEach(i => { const a = lower[i], b = upper[i]; const ca = centroid(lower), cb = centroid(upper); const o1 = new V3().subVectors(a, ca).normalize().multiplyScalar(0.12), o2 = new V3().subVectors(b, cb).normalize().multiplyScalar(0.12); g.push(rod(a.clone().add(o1), b.clone().add(o2), 0.13, { seg: 8 })); });
    });
    add(mergeGeoms(g), 'osteo', 'synd', 'synd', { level: null });
    anchors.set('synd', SPf('L2-L3', s => [s.W / 2 * 0.55, 0, s.D / 2 * 0.9]));
  }
  if (mods.dish) {
    const pts = []; for (let u = KI.T4; u <= KI.T12 + 0.01; u += 0.5) { const s = spineAt(u); pts.push(s.p.clone().add(v(-s.W / 2 * 0.62, 0, s.D / 2 * 0.72 + 0.2).applyQuaternion(s.q))); }
    add(tube(pts, t => 0.42 + 0.2 * Math.abs(Math.sin(t * Math.PI * 8.5)), { N: 12 }), 'osteo', 'dish', 'dish', { level: null });
    anchors.set('dish', SPf('T8', s => [-s.W / 2 * 0.62, 0, s.D / 2 * 0.72 + 0.4]));
  }
  (mods.lesions || []).forEach((L_, i) => {
    const f = F[L_.v]; const c = toW(f, L_.x || 0, L_.y || 0, L_.z || 0);
    add(ellip(c, L_.r, L_.r * (L_.ry || 0.9), L_.r, 16, f.q), L_.kind || 'tumor', L_.key || ('tumor.' + L_.v), L_.info || 'tumor', { level: L_.v });
    anchors.set(L_.key || ('tumor.' + L_.v), c);
  });
  if (mods.schmorl) mods.schmorl.forEach(n => { const f = F[n]; [1, -1].forEach(s => add(ellip(toW(f, 0.2 * s, s * (f.h / 2 - 0.3), -0.1), 0.35, 0.28, 0.35, 12, f.q), 'tumor', 'schmorl.' + n, 'schmorl', { level: n })); anchors.set('schmorl.' + n, toW(f, 0.2, f.h / 2 - 0.3, -0.1)); });
  if (mods.burst) {
    const n = mods.burst, f = F[n], l = LV[n];
    const frag = toW(f, 0, f.h * 0.22, -fr_post(l, f) - 0.25);
    add(mergeGeoms([ellip(frag, 0.75, 0.42, 0.38, 14, f.q)]), 'boneHot', 'frag', 'frag', { level: n });
    anchors.set('frag', frag);
    [-0.8, 0.9].forEach((x, i) => add(new THREE.BoxGeometry(0.06, f.h * 1.05, l.D * 1.1).applyMatrix4(new THREE.Matrix4().makeRotationFromQuaternion(f.q)).translate(...toW(f, x, 0, 0).toArray()), 'lesion', 'crack.' + n, 'fxline', { level: n }));
  }
  function fr_post(l, f) { return f.Dw / 2 * 0.8; }
  if (mods.abscess) {
    const a = mods.abscess; const f = F[a.v];
    add(ellip(toW(f, a.x, a.y || 0, a.z || 0), a.rx, a.ry, a.rz, 18, f.q), 'abscess', 'abscess', 'abscess', { level: a.v });
    anchors.set('abscess', toW(f, a.x, a.y || 0, a.z || 0));
  }
  if (mods.myeloLesion) {
    const u0 = KI[mods.myeloLesion]; const smp = [];
    for (let u = u0 - 0.6; u <= u0 + 0.6; u += 0.1) { const s = spineAt(u); const [rx, rz] = cordR(u); smp.push({ c: s.p.clone().add(v(0, 0, s.zc).applyQuaternion(s.q)), q: s.q, rx: rx * 0.6, rz: rz * 0.75 }); }
    const rr = smp.map(o => { const r = []; for (let k = 0; k < 12; k++) { const t = 2 * Math.PI * k / 12; r.push(o.c.clone().add(v(Math.cos(t) * o.rx * 1.75, 0, Math.sin(t) * o.rz * 1.35).applyQuaternion(o.q))); } return r; });
    add(loft(rr, true, true), 'cordLesion', 'myelo.lesion', 'myelolesion', { level: null });
    anchors.set('myelo.lesion', SP(u0, 0, 0, spineAt(u0).zc));
  }
  if (mods.erosion) mods.erosion.forEach(([n, s]) => { const f = F[n], l = LV[n]; const c = toW(f, 0, s * (f.h / 2 - 0.2), 0); add(ellip(c, l.W * 0.36, 0.3, l.D * 0.34, 16, f.q), 'tumor', 'erosion.' + n, 'erosion', { level: n }); anchors.set('erosion.' + n, c); });

  // âncora de centros e metadados
  anchors.set('center', SP(KI.T10, 0, 0, 0));
  const kfy = KF.map(k => k.p.y);
  meshes.forEach(m => {
    if (m.userData.level) return;
    m.geometry.computeBoundingBox(); const b = m.geometry.boundingBox;
    let u0 = 1e9, u1 = -1e9; kfy.forEach((y, i) => { if (y >= b.min.y - 0.6 && y <= b.max.y + 0.6) { u0 = Math.min(u0, i); u1 = Math.max(u1, i); } });
    if (u0 <= u1) { m.userData.u0 = u0; m.userData.u1 = u1; }
  });
  return { root, reg, anchors, meshes, F, KI, spineAt, SP };
}

  split.onpointerdown = e => {
    if (e.button !== 0) return;
    e.preventDefault(); split.setPointerCapture(e.pointerId);
    split.classList.add('drag'); document.body.classList.add('resizing');
    split.onpointermove = ev => setPw(stage.getBoundingClientRect().right - ev.clientX);
    split.onpointerup = split.onpointercancel = () => {
      split.onpointermove = split.onpointerup = split.onpointercancel = null;
      split.classList.remove('drag'); document.body.classList.remove('resizing'); keepPw();
    };
  };
  split.ondblclick = () => { setPw(PW); keepPw(); };
  split.onkeydown = e => {
    const d = { ArrowLeft: 40, ArrowRight: -40 }[e.key];
    if (d) { e.preventDefault(); setPw(pw + d); keepPw(); }
  };
  addEventListener('resize', () => setPw(store.pw || PW));
  setPw(store.pw || PW);

  /* ---------- laço ---------- */
  if (has3D) {
    function resize() { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix(); LBL.forEach(L => L.bw = 0); invalidate(); }
    new ResizeObserver(resize).observe(view);
    // o cartão da estrutura fica logo acima da barra de ferramentas, qualquer que seja a altura dela
    new ResizeObserver(() => { view.style.setProperty('--dock-h', toolsBox.offsetHeight + 'px'); invalidate(); }).observe(toolsBox);
    let visibleView = true;
    if ('IntersectionObserver' in window) new IntersectionObserver(es => { visibleView = es[0].isIntersecting; invalidate(); }).observe(view);
    // qualquer interação pode mudar rótulos, camadas ou o limite do painel de ferramentas
    ['pointerdown', 'pointerup', 'click', 'keydown', 'wheel'].forEach(ev => addEventListener(ev, invalidate, { capture: true, passive: true }));
    const frame = t => {
      requestAnimationFrame(frame);
      if (!visibleView && !tween) return;
      if (tween) { stepTween(t); dirty = 2; }
      if (controls.update()) dirty = 2;
      if (!dirty && !(pulse && !reduce)) return;
      const k = reduce ? .4 : .3 + .2 * Math.sin(t / 280);
      hotMats.forEach(m => m.emissiveIntensity = k);
      renderer.render(scene, camera);
      if (dirty) { updateLabels(); dirty--; }
    };
    rebuild({});
    resize();
    const first = ALL_STEPS[S.step].cam || STEPS[0].cam;
    const T = resolveTarget(first.t); controls.target.copy(T); placeCam(T, { r: first.d, az: first.az * deg, el: first.el * deg });
    requestAnimationFrame(frame);
    $('#loading').hidden = true;
  }
  if (store.tools) setTools(true);
  if (location.hash === '#doencas') setMode('dz'); else renderStep();
  window.__spine = { S, get model() { return model; }, get plane() { return plane; }, get renderer() { return renderer; }, KIND, slabOut, goStep, openDz, setMode, camera, controls, setFull };
})();
