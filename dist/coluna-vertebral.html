<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="/icone-32.png">
<link rel="apple-touch-icon" href="/icone-180.png">
<title>Coluna Vertebral 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: estação de leitura. Roteiro da aula e modelo 3D lado a lado; no celular o texto lidera e o 3D é chamado sob demanda. */
:root {
  --paper: #EEF1F0;
  --panel: #FFFFFF;
  --ink: #18221F;
  --ink-2: #3F4B49;
  --ink-3: #5F6B68;
  --line: #D6DEDB;
  --line-strong: #8E9A97;
  --accent: #0D6669;
  --accent-soft: #E1EFEE;
  --sel: #127E83;
  --path: #B5432B;
  --path-soft: #F8E9E4;
  --lightbox-a: #F6F8F8;
  --lightbox-b: #DCE5E4;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16.5px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.top { display: flex; align-items: center; gap: 20px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.brand h1 { font-weight: 700; font-size: 20px; margin: 0; }
.brand a { color: inherit; text-decoration: none; }
.brand a:hover { text-decoration: underline; text-underline-offset: 3px; }
.seg { display: inline-flex; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14.5px; color: var(--ink-2); min-height: 34px; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(20,40,40,.14); }
.seg button.dz[aria-pressed="true"] { color: var(--path); }
.prog { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.prog .bar { width: 110px; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.prog .bar i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left center; transform: scaleX(0); transition: transform .4s; }
.progreset { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: none; color: var(--ink-3); font-size: 15px; line-height: 1; cursor: pointer; }
.progreset:hover, .progreset:focus-visible { color: var(--accent); }
/* conta: discreta, no fim da barra; no celular sobe para a linha do título */
.conta { order: 1; display: flex; align-items: center; gap: 4px; font-size: 14px; color: var(--ink-3); }
.quem { max-width: 16em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sair { border: 0; background: none; padding: 0 6px; min-height: 32px; border-radius: 6px; color: var(--ink-2); font-size: 14px; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.sair:hover { color: var(--accent); }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) 0 var(--pw, 430px); grid-template-areas: "view split panel"; min-height: 0; }
.panel { grid-area: panel; }
/* divisória: área de toque de 12px sobre a borda do painel, alça visível no meio */
.split { grid-area: split; position: relative; z-index: 7; }
.split::before { content: ""; position: absolute; top: 0; bottom: 0; left: -6px; width: 12px; cursor: col-resize; touch-action: none; }
.split::after { content: ""; position: absolute; top: 50%; left: -3px; width: 6px; height: 44px; margin-top: -22px; border-radius: 3px; background: var(--ink-3); transition: background-color .15s; pointer-events: none; }
.split:hover::after, .split:focus-visible::after, .split.drag::after { background: var(--accent); }
.split:focus-visible { outline: none; }
body.resizing { cursor: col-resize; user-select: none; }
.view { grid-area: view; position: relative; min-height: 0; background: radial-gradient(120% 90% at 40% 35%, var(--lightbox-a), var(--lightbox-b)); overflow: hidden; }
.view::after { content: ""; position: absolute; inset: 0; background: rgba(24,34,31,.14); opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 0; }
.view.dim::after { opacity: 1; }
#gl { position: absolute; z-index: 1; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#gl:active { cursor: grabbing; }
.loading { z-index: 5; position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; color: var(--ink-2); pointer-events: none; }
.fail { z-index: 6; position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
.fail p { max-width: 36ch; margin: 0 0 12px; color: var(--ink-2); }

/* rótulos */
#labels { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
#labels svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.lbl { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; white-space: nowrap; font-size: 14px; font-weight: 600; line-height: 1; padding: 5px 8px; border-radius: 5px; background: rgba(255,255,255,.94); border: 1px solid var(--line); color: var(--ink); box-shadow: 0 1px 3px rgba(20,40,40,.1); }
.lbl.hot { border-color: var(--path); color: var(--path); }
.lbl.sel { background: var(--sel); border-color: var(--sel); color: #fff; }
.lbl:hover { border-color: var(--accent); }

/* ferramentas sobre o 3D */
.ttog { z-index: 3; position: absolute; left: 12px; top: 12px; border: 1px solid var(--line-strong); background: rgba(255,255,255,.95); border-radius: 8px; padding: 6px 12px; font-size: 14.5px; font-weight: 600; cursor: pointer; min-height: 36px; }
.ttog[aria-expanded="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.tools { z-index: 3; position: absolute; left: 12px; right: 64px; top: 56px; display: none; flex-wrap: wrap; gap: 6px; align-items: flex-start; }
.tools.open { display: flex; }
.group { display: flex; flex-wrap: wrap; gap: 4px; background: rgba(255,255,255,.95); border: 1px solid var(--line); border-radius: 8px; padding: 4px; }
.chip { border: 1px solid transparent; background: transparent; border-radius: 5px; padding: 4px 9px; font-size: 14px; cursor: pointer; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; min-height: 32px; }
.chip .sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; opacity: .35; }
.chip[aria-pressed="true"] { background: var(--panel); border-color: var(--line-strong); color: var(--ink); }
.chip[aria-pressed="true"] .sw { opacity: 1; }
.chip:hover { color: var(--ink); }
.lvsel { display: none; }
.hint { z-index: 2; position: absolute; left: 6px; bottom: 4px; font-size: 9px; color: var(--ink-2); pointer-events: none; background: rgba(246,248,248,.85); padding: 0 4px; border-radius: 2px; }
.explore, .done3d { display: none; }

/* trilha à esquerda: Anatomia/Doenças e a lista vertical de capítulos (ou grupos de doenças).
   No desktop as ferramentas ficam sempre abertas no topo do 3D, centralizadas entre a borda e a régua. */
.rail { display: none; }
@media (min-width: 900.02px) {
  .stage { grid-template-columns: var(--rail, 232px) minmax(0, 1fr) 0 var(--pw, 430px); grid-template-areas: "rail view split panel"; }
  .rail { grid-area: rail; display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow-y: auto; padding: 12px; background: var(--panel); border-right: 1px solid var(--line); box-sizing: border-box; }
  /* três partes não cabem numa linha da trilha: a que sobra desce para a linha de baixo, sem cortar o texto */
  .rail .seg { display: flex; flex-wrap: wrap; }
  .rail .seg button { flex: 1 1 auto; min-height: 38px; padding: 0 6px; white-space: nowrap; }
  .hint { max-width: calc(100% - 92px); }
  .rail-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink-3); padding: 0 0 0 12px; }
  .railx { display: grid; place-items: center; flex: 0 0 auto; width: 32px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink-2); font-size: 18px; line-height: 1; cursor: pointer; }
  .railx:hover { border-color: var(--accent); color: var(--ink); }
  /* trilha recolhida: sobra uma faixa estreita com o botão de reabrir */
  .stage.railoff { --rail: 46px; }
  .railoff .rail { padding: 12px 6px; }
  .railoff .rail > :not(.rail-h), .railoff #railh { display: none; }
  .railoff .rail-h { padding: 0; justify-content: center; }
  .rail .chapwrap { border: 0; }
  .rail .chapwrap::before, .rail .chapwrap::after { display: none; }
  .rail .chap { flex-direction: column; gap: 2px; padding: 0; overflow: visible; }
  .rail .chap button { width: 100%; justify-content: flex-start; text-align: left; white-space: normal; border-color: transparent; border-radius: 8px; min-height: 44px; padding: 8px 12px; font-size: 15px; line-height: 1.3; }
  .rail .chap button b { min-width: 14px; }
  .rail .chap button:hover:not([aria-current="step"]) { background: var(--paper); }
  .rail .chap button.done:not([aria-current="step"])::after { margin-left: auto; }
  .ttog { display: none; }
  .tools { display: grid; grid-template-columns: minmax(0, max-content); justify-content: center; top: 12px; left: 12px; right: 68px; gap: 6px; pointer-events: none; }
  .tools .group { justify-content: center; pointer-events: auto; box-shadow: 0 1px 4px rgba(20,40,40,.08); }
}
@media (min-width: 900.02px) and (max-width: 1200px) { .stage { --rail: 196px; } }

/* régua de níveis */
.ruler { z-index: 3; position: absolute; right: 12px; top: 12px; bottom: 12px; width: 44px; display: flex; flex-direction: column; background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 8px; padding: 4px 0; overflow-y: auto; scrollbar-width: none; }
.ruler::-webkit-scrollbar { display: none; }
.ruler button { flex: 1 1 0; min-height: 14px; border: 0; background: transparent; font-size: 12px; font-weight: 600; color: var(--ink-2); cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; padding: 0; font-variant-numeric: tabular-nums; }
.ruler button::before { content: ""; position: absolute; left: 3px; top: 15%; bottom: 15%; width: 3px; border-radius: 2px; background: var(--rc); opacity: .6; }
.ruler button:hover, .ruler button.on { color: var(--ink); background: var(--accent-soft); }
.ruler button.on { font-weight: 700; }
.ruler.short { bottom: auto; max-height: calc(100% - 24px); }
.ruler.short button { flex: 0 0 34px; }
.ruler button[hidden] { display: none; }
.ruler.short::before { content: "Níveis"; display: block; font-size: 11px; font-weight: 600; color: var(--ink-3); text-align: center; padding: 2px 0 4px; }

/* cartão de estrutura */
.info { z-index: 4; position: absolute; left: 12px; bottom: 40px; width: min(340px, calc(100% - 80px)); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px; padding: 12px 14px; box-shadow: 0 2px 8px rgba(20,40,40,.1); }
.info h3 { margin: 0 0 4px; font-size: 18px; font-weight: 700; padding-right: 28px; text-wrap: balance; }
.info .meta { font-size: 14px; color: var(--ink-3); margin-bottom: 6px; }
.info p { margin: 0; font-size: 15px; color: var(--ink-2); }
.info ul { margin: 6px 0 0; padding-left: 16px; font-size: 14.5px; color: var(--ink-2); }
.info .note { margin-top: 6px; font-size: 13.5px; color: var(--ink-3); }
.info .x { position: absolute; right: 6px; top: 6px; border: 0; background: transparent; cursor: pointer; font-size: 20px; line-height: 1; color: var(--ink-3); width: 32px; height: 32px; border-radius: 6px; }
.info .x:hover { background: var(--paper); color: var(--ink); }
.info .acts { margin-top: 10px; display: flex; gap: 6px; }

/* painel */
.panel { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.chapwrap { position: relative; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
.chapwrap::before, .chapwrap::after { content: ""; position: absolute; top: 0; bottom: 0; width: 34px; pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 1; }
.chapwrap::before { left: 0; background: linear-gradient(to right, var(--panel), rgba(255,255,255,0)); }
.chapwrap::after { right: 0; background: linear-gradient(to left, var(--panel), rgba(255,255,255,0)); }
.chapwrap.more-l::before, .chapwrap.more-r::after { opacity: 1; }
.chap { display: flex; gap: 4px; padding: 10px 14px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; scroll-behavior: smooth; }
.chap::-webkit-scrollbar { display: none; }
.chap button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px; font-size: 14px; cursor: pointer; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; min-height: 34px; }
.chap button b { font-weight: 700; font-size: 13px; color: var(--ink-3); }
.chap button[aria-current="step"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.chap button[aria-current="step"] b { color: #B9C7C4; }
.chap button.done:not([aria-current="step"])::after { content: "✓"; color: var(--accent); font-weight: 700; }
.scroll { flex: 1 1 auto; overflow-y: auto; padding: 20px 22px 24px; min-height: 0; }
.eyebrow { font-size: 14px; color: var(--ink-3); }
.scroll h2 { font-weight: 700; font-size: 26px; line-height: 1.2; margin: 4px 0 14px; text-wrap: balance; }
.scroll h2:focus { outline: none; }
.scroll p { margin: 0 0 12px; }
.how { font-size: 15px; color: var(--ink-2); padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.how b { color: var(--ink); }
.quando { margin: 12px 0 18px; padding: 12px 14px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; background: var(--paper); font-size: 15px; }
.quando dt { font-weight: 700; color: var(--accent); }
.quando dd { margin: 0 0 8px; }
.quando dd:last-child { margin-bottom: 0; }
.pro { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line); }
.pro .h { font-weight: 700; font-size: 16px; color: var(--accent); margin-bottom: 4px; }
.pro p { margin: 0; }
.see { margin-top: 18px; }
.see .h { font-size: 14px; color: var(--ink-3); margin-bottom: 2px; }
.see .row { display: flex; flex-wrap: wrap; gap: 0 18px; }
.see button { border: 0; background: none; padding: 7px 0; min-height: 36px; font-size: 15.5px; cursor: pointer; color: var(--accent); text-decoration: underline; text-decoration-color: rgba(13,102,105,.4); text-underline-offset: 3px; }
.see button:hover { text-decoration-color: var(--accent); }
.askfab { position: fixed; right: 20px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 20; min-height: 44px; padding: 0 18px; border: 1px solid var(--ink); border-radius: 999px; background: var(--ink); color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.askwin { position: fixed; right: 20px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 21; width: min(380px, calc(100vw - 32px)); max-height: min(520px, calc(100vh - 120px)); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
.askfab[hidden], .askwin[hidden] { display: none; }
.askgrip { position: absolute; top: 0; left: 0; width: 14px; height: 14px; padding: 0; border: 0; border-radius: 12px 0 0 0; background: none; cursor: nwse-resize; touch-action: none; }
.askgrip:focus-visible { outline: 2px solid var(--accent); }
.askhd { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--line); }
.askhd span { color: var(--ink-3); font-size: 13px; }
@media (min-width: 900.02px) { .askhd { cursor: move; touch-action: none; user-select: none; } }
.askx { margin-left: auto; width: 36px; height: 36px; border: 0; border-radius: 6px; background: none; color: var(--ink-2); font-size: 16px; cursor: pointer; }
.askout { flex: 1 1 auto; min-height: 60px; overflow-y: auto; padding: 12px 16px; font-size: 15px; }
.askout p { margin: 0 0 12px; white-space: pre-wrap; }
.askout .q { margin-bottom: 4px; color: var(--ink-3); font-size: 14px; }
.askrow { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
.askrow input { flex: 1; min-width: 0; min-height: 40px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); font: inherit; }
/* microfone: gravando fica na cor de patologia; o pulso só para quem não pediu menos movimento */
.askmic { flex: none; display: grid; place-items: center; width: 42px; min-height: 42px; padding: 0; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--panel); color: var(--ink-2); cursor: pointer; }
.askmic:hover { border-color: var(--ink-2); color: var(--ink); }
.askmic[aria-pressed="true"] { background: var(--path); border-color: var(--path); color: #fff; }
.askmic:disabled { opacity: .5; cursor: progress; }
@media (prefers-reduced-motion: no-preference) { .askmic[aria-pressed="true"] { animation: askrec 1.2s ease-in-out infinite; } }
@keyframes askrec { 50% { box-shadow: 0 0 0 4px var(--path-soft); } }
@media (max-width: 900px) { .askfab { right: 16px; } .askwin { right: 16px; left: 16px; width: auto; } .askgrip { display: none; } .askhd { padding-left: 16px; } .askmic { width: 44px; min-height: 44px; } }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--panel); }
.btn { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 8px; padding: 8px 16px; cursor: pointer; font-weight: 600; font-size: 15px; min-height: 42px; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { background: #0A5558; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.sm { padding: 5px 12px; font-size: 14px; min-height: 36px; }
.btn.link { border-color: transparent; background: none; color: var(--accent); padding-left: 0; }

/* gráfico Wilke */
.bars { margin: 14px 0 4px; display: grid; gap: 7px; }
.bars .r { display: grid; grid-template-columns: 170px minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-size: 14.5px; }
.bars .t { height: 12px; border-radius: 3px; overflow: hidden; }
.bars .t i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bars .v { font-size: 14px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.bars .note { font-size: 13.5px; color: var(--ink-3); }

/* quiz */
.q { padding: 4px 0 18px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.q .qt { font-weight: 600; margin-bottom: 10px; }
.q .opts { display: grid; gap: 6px; }
.q .opts button { text-align: left; border: 1px solid var(--line-strong); background: var(--panel); border-radius: 7px; padding: 9px 12px; cursor: pointer; font-size: 15.5px; min-height: 44px; }
.q .opts button:hover:not(:disabled) { border-color: var(--accent); }
.q .opts button.ok { border-color: var(--accent); background: var(--accent-soft); }
.q .opts button.no { border-color: var(--path); background: var(--path-soft); }
.q .opts button:disabled { cursor: default; }
.q .ex { margin-top: 8px; font-size: 15px; color: var(--ink-2); }
.qfoot { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.score { font-size: 15px; font-weight: 600; color: var(--accent); }

/* doenças */
.dzcat { margin: 26px 0 4px; font-size: 18px; font-weight: 700; color: var(--ink); }
.dzcat:first-child { margin-top: 0; }
.dzlist { display: grid; }
.dzi { display: flex; justify-content: space-between; gap: 12px; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 11px 2px; cursor: pointer; align-items: baseline; min-height: 44px; }
.dzi:hover span { color: var(--path); }
.dzi span { font-weight: 600; }
.dzi em { font-style: normal; font-size: 14px; color: var(--ink-3); white-space: nowrap; }
.dzi.seen span::after { content: " ✓"; color: var(--accent); font-weight: 400; }
.others { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
.others summary { cursor: pointer; font-weight: 600; min-height: 32px; }
.others dl { margin: 10px 0 0; }
.others dt { font-weight: 600; font-size: 15px; margin-top: 8px; }
.others dd { margin: 2px 0 0; font-size: 15px; color: var(--ink-2); }
.back { border: 0; background: transparent; cursor: pointer; color: var(--ink-2); padding: 6px 0; font-size: 15px; margin-bottom: 6px; min-height: 36px; }
.back:hover { color: var(--ink); }
.lvtag { font-size: 15px; color: var(--path); font-weight: 600; margin: -6px 0 12px; }
.dzbar { margin: 0 0 16px; }
/* variantes da hérnia: posição em 2 colunas e forma em 3, para caber em 390 px */
.hvt { margin: 12px 0 4px; font-size: 14px; font-weight: 600; color: var(--ink-2); }

<script>
/* ============ Geometria procedural da coluna (unidades: cm) ============
   Eixos: y para cima, +z anterior, +x esquerda do paciente. */
const V3 = THREE.Vector3;
const deg = Math.PI / 180;
const v = (x, y, z) => new V3(x, y, z);

/* ---------- utilidades de malha ---------- */
function centroid(pts) { const c = new V3(); pts.forEach(p => c.add(p)); return c.multiplyScalar(1 / pts.length); }

function loft(rings, capS = true, capE = true, insetS = 0, insetE = 0, strip = false) {
  const R = rings.length, N = rings[0].length;
  const pos = [], idx = [];
  rings.forEach(r => r.forEach(p => pos.push(p.x, p.y, p.z)));
  let rm = Math.min(Math.floor(R / 2), R - 2);
  const a = rings[rm][0], b = rings[rm][1], c = rings[rm + 1][0];
  const n = new V3().subVectors(b, a).cross(new V3().subVectors(c, a));
  const out = new V3().subVectors(a, centroid(rings[rm]));
  const flip = n.dot(out) < 0;
  for (let r = 0; r < R - 1; r++) for (let i = 0; i < N; i++) {
    const j = (i + 1) % N, A = r * N + i, B = r * N + j, C = (r + 1) * N + i, D = (r + 1) * N + j;
    if (!flip) idx.push(A, B, C, B, D, C); else idx.push(A, C, B, B, C, D);
  }
  const cap = (ri, nb, inset) => {
    const ring = rings[ri], cc = centroid(ring), cn = centroid(rings[nb]);
    const dir = new V3().subVectors(cc, cn); const len = dir.length() || 1; dir.divideScalar(len);
    const center = cc.clone().addScaledVector(dir, -inset);
    const base = pos.length / 3;
    ring.forEach(p => pos.push(p.x, p.y, p.z));
    const ci = pos.length / 3; pos.push(center.x, center.y, center.z);
    const t0 = new V3().subVectors(ring[0], center).cross(new V3().subVectors(ring[1], center));
    // faixa curva: o centro cai fora dela e o leque se sobrepõe (listras no corte), então a tampa liga borda de dentro e de fora, no sentido das paredes
    const f = strip ? (ri === 0) !== flip : t0.dot(dir) < 0;
    if (strip) for (let i = 0; i < N / 2 - 1; i++) { const a = base + i, b = base + i + 1, c = base + N - 2 - i, d = base + N - 1 - i; if (!f) idx.push(a, b, d, b, c, d); else idx.push(a, d, b, b, d, c); }
    else for (let i = 0; i < N; i++) { const j = (i + 1) % N; if (!f) idx.push(ci, base + i, base + j); else idx.push(ci, base + j, base + i); }
  };
  if (capS) cap(0, 1, insetS);
  if (capE) cap(R - 1, R - 2, insetE);
  // o teste pelo centroide do anel erra em faixas curvas (LLA): malha fechada com volume negativo tem as normais para dentro
  if (capS && capE) {
    let vol = 0;
    for (let t = 0; t < idx.length; t += 3) { const [a, b, c] = [idx[t], idx[t + 1], idx[t + 2]].map(k => new V3(pos[3 * k], pos[3 * k + 1], pos[3 * k + 2])); vol += a.dot(b.cross(c)); }
    if (vol < 0) for (let t = 0; t < idx.length; t += 3) [idx[t + 1], idx[t + 2]] = [idx[t + 2], idx[t + 1]];
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

/* loft com tampas trianguladas (earcut): anel em U ou em arco não é estrelado a partir do centro e o leque da tampa
   se sobrepunha. uv(ri): coordenadas 2D do anel ri no plano dele. Paredes orientadas pelo ponto mais longe do centro do
   anel do meio (ali a normal de fora aponta para longe do centro); tampas para longe do anel vizinho */
function loftEar(rings, uv) {
  const R = rings.length, N = rings[0].length, pos = [], idx = [];
  rings.forEach(r => r.forEach(p => pos.push(p.x, p.y, p.z)));
  const rm = Math.floor((R - 1) / 2), c = centroid(rings[rm]);
  let im = 0; rings[rm].forEach((p, i) => { if (p.distanceTo(c) > rings[rm][im].distanceTo(c)) im = i; });
  const a = rings[rm][im], b = rings[rm][(im + 1) % N], d = rings[rm + 1][im];
  const flip = new V3().subVectors(b, a).cross(new V3().subVectors(d, a)).dot(new V3().subVectors(a, c)) < 0;
  for (let r = 0; r < R - 1; r++) for (let i = 0; i < N; i++) {
    const j = (i + 1) % N, A = r * N + i, B = r * N + j, C = (r + 1) * N + i, D = (r + 1) * N + j;
    if (!flip) idx.push(A, B, C, B, D, C); else idx.push(A, C, B, B, C, D);
  }
  [[0, 1], [R - 1, R - 2]].forEach(([ri, nb]) => {
    const tri = THREE.ShapeUtils.triangulateShape(uv(ri).map(([x, y]) => new THREE.Vector2(x, y)), []), rg = rings[ri], base = ri * N;
    const out = new V3().subVectors(centroid(rg), centroid(rings[nb])), sum = new V3();
    tri.forEach(([p, q, s]) => sum.add(new V3().subVectors(rg[q], rg[p]).cross(new V3().subVectors(rg[s], rg[p]))));
    const f = sum.dot(out) < 0;
    tri.forEach(([p, q, s]) => f ? idx.push(base + p, base + s, base + q) : idx.push(base + p, base + q, base + s));
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

/* junta malhas mantendo o índice: mesmos triângulos e normais, cerca de um terço dos vértices */
function mergeGeoms(list) {
  const arr = list.filter(Boolean); arr.forEach(g => { if (!g.attributes.normal) g.computeVertexNormals(); });
  let tot = 0, ti = 0; arr.forEach(g => { tot += g.attributes.position.count; ti += g.index ? g.index.count : g.attributes.position.count; });
  const P = new Float32Array(tot * 3), Nn = new Float32Array(tot * 3), I = new (tot > 65535 ? Uint32Array : Uint16Array)(ti); let o = 0, oi = 0;
  arr.forEach(g => {
    const n = g.attributes.position.count;
    P.set(g.attributes.position.array, o * 3); Nn.set(g.attributes.normal.array, o * 3);
    if (g.index) { const a = g.index.array; for (let i = 0; i < a.length; i++) I[oi++] = a[i] + o; }
    else for (let i = 0; i < n; i++) I[oi++] = o + i;
    o += n;
  });
  const m = new THREE.BufferGeometry();
  m.setAttribute('position', new THREE.BufferAttribute(P, 3)); m.setAttribute('normal', new THREE.BufferAttribute(Nn, 3)); m.setIndex(new THREE.BufferAttribute(I, 1));
  return m;
}

/* bastão (cápsula) entre a e b; f achata a seção na direção 'side' */
function rod(a, b, r, o = {}) {
  const r2 = o.r2 ?? r, f = o.f ?? 1, seg = o.seg ?? 14;
  const dir = new V3().subVectors(b, a); const len = dir.length(); dir.normalize();
  let side = o.side ? o.side.clone() : new V3().crossVectors(dir, v(0, 1, 0));
  if (side.lengthSq() < 1e-6) side = v(1, 0, 0);
  side.addScaledVector(dir, -side.dot(dir)).normalize();
  const third = new V3().crossVectors(side, dir).normalize();
  const M = new THREE.Matrix4().makeBasis(side, dir, third);
  const S = new THREE.Matrix4().makeScale(f, 1, 1);
  const parts = [], caps = o.caps !== false;
  // sem pontas, o cilindro se fecha sozinho; a tampa do corte precisa de peça fechada
  const cyl = new THREE.CylinderGeometry(r2, r, len, seg, 1, caps);
  cyl.applyMatrix4(S); cyl.applyMatrix4(M);
  cyl.translate((a.x + b.x) / 2, (a.y + b.y) / 2, (a.z + b.z) / 2); parts.push(cyl);
  if (caps) {
    /* pontas: calota tangente ao cone, começando exatamente na boca do cilindro (mesmos vértices).
       Esfera inteira no extremo saía para fora do cone que afina e virava fenda; tampa do cilindro por dentro dela vazava pelas facetas. */
    const be = Math.atan2(r - r2, len), hs = Math.max(3, Math.ceil(seg / 4));
    [[a, r, -1], [b, r2, 1]].forEach(([p, rr, e]) => {
      const R = rr / Math.cos(be), c = p.clone().addScaledVector(dir, -rr * Math.tan(be));
      const s = e > 0 ? new THREE.SphereGeometry(R, seg, hs, Math.PI / 2, Math.PI * 2, 0, Math.PI / 2 - be)
        : new THREE.SphereGeometry(R, seg, hs, Math.PI / 2, Math.PI * 2, Math.PI / 2 - be, Math.PI / 2 + be);
      s.applyMatrix4(S); s.applyMatrix4(M); s.translate(c.x, c.y, c.z); parts.push(s);
    });
  }
  return mergeGeoms(parts);
}

function ellip(c, rx, ry, rz, seg = 16, q) {
  const g = new THREE.SphereGeometry(1, seg, Math.max(8, seg * 0.6 | 0));
  g.scale(rx, ry, rz); if (q) g.applyMatrix4(new THREE.Matrix4().makeRotationFromQuaternion(q)); g.translate(c.x, c.y, c.z); return g;
}

/* placa grossa a partir de 4 cantos (quadrilátero) */
function quadSlab(p1, p2, p3, p4, th) {
  const n = new V3().subVectors(p3, p1).cross(new V3().subVectors(p4, p2)).normalize().multiplyScalar(th / 2);
  const P = [p1, p2, p3, p4].map(p => p.clone().add(n)), Q = [p1, p2, p3, p4].map(p => p.clone().sub(n));
  return loft([P, Q], true, true);
}

/* tubo ao longo de pontos, com raio variável e transporte paralelo */
function tube(points, rFn, o = {}) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
  const n = o.n ?? Math.max(12, Math.round(curve.getLength() * (o.density ?? 2.2)));
  const N = o.N ?? 10;
  const pts = curve.getSpacedPoints(n);
  const T = pts.map((p, i) => { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n, i + 1)]; return new V3().subVectors(b, a).normalize(); });
  let nrm = o.up ? o.up.clone() : v(0, 1, 0);
  if (Math.abs(nrm.dot(T[0])) > 0.95) nrm = v(1, 0, 0);
  nrm.addScaledVector(T[0], -nrm.dot(T[0])).normalize();
  const rings = [];
  for (let i = 0; i <= n; i++) {
    if (i > 0) { const q = new THREE.Quaternion().setFromUnitVectors(T[i - 1], T[i]); nrm.applyQuaternion(q); nrm.addScaledVector(T[i], -nrm.dot(T[i])).normalize(); }
    let ax = nrm;
    if (o.upFn) { const u = o.upFn(i / n).clone(); u.addScaledVector(T[i], -u.dot(T[i])); if (u.lengthSq() > 1e-6) ax = u.normalize(); }
    const az = new V3().crossVectors(T[i], ax).normalize();
    const r = rFn(i / n); const rz = o.flat ? r * o.flat : r;
    const ring = [];
    for (let k = 0; k < N; k++) { const th = 2 * Math.PI * k / N; ring.push(pts[i].clone().addScaledVector(ax, Math.cos(th) * r).addScaledVector(az, Math.sin(th) * rz)); }
    rings.push(ring);
  }
  return loft(rings, o.caps !== false, o.caps !== false);
}

/* ---------- dados anatômicos (médias aproximadas de adulto, cm) ---------- */
function makeLevels() {
  const L = [];
  const C = [['C1', 1.0, 2.0, 1.0, 2.8, 1.9], ['C2', 1.6, 1.7, 1.5, 2.3, 1.6], ['C3', 1.4, 1.7, 1.5, 2.4, 1.5], ['C4', 1.4, 1.8, 1.55, 2.45, 1.45],
  ['C5', 1.4, 1.9, 1.6, 2.5, 1.45], ['C6', 1.45, 2.1, 1.65, 2.5, 1.45], ['C7', 1.5, 2.3, 1.7, 2.4, 1.45]];
  C.forEach(([n, h, W, D, cw, ca]) => L.push({ n, r: 'C', h, W, D, cw, ca }));
  for (let i = 0; i < 12; i++) {
    const t = i / 11;
    L.push({ n: 'T' + (i + 1), r: 'T', h: 1.65 + 0.75 * t, W: 2.6 + 1.4 * t * t * 0.6 + 0.55 * t, D: 1.75 + 1.25 * t, cw: 1.62 + 0.42 * Math.abs(t - 0.45) * 1.8 * (t > 0.45 ? 0.8 : 0.5), ca: 1.5 + 0.12 * t });
  }

    add(tube(pts, t => 0.42 + 0.2 * Math.abs(Math.sin(t * Math.PI * 8.5)), { N: 12 }), 'osteo', 'dish', 'dish', { level: null });
    anchors.set('dish', SPf('T8', s => [-s.W / 2 * 0.62, 0, s.D / 2 * 0.72 + 0.4]));
  }
  (mods.lesions || []).forEach((L_, i) => {
    const f = F[L_.v]; const c = toW(f, L_.x || 0, L_.y || 0, L_.z || 0);
    add(ellip(c, L_.r, L_.r * (L_.ry || 0.9), L_.r, 16, f.q), L_.kind || 'tumor', L_.key || ('tumor.' + L_.v), L_.info || 'tumor', { level: L_.v });
    anchors.set(L_.key || ('tumor.' + L_.v), c);
  });
  if (mods.schmorl) mods.schmorl.forEach(n => { const f = F[n]; [1, -1].forEach(s => add(ellip(toW(f, 0.2 * s, s * (f.h / 2 - 0.3), -0.1), 0.35, 0.28, 0.35, 12, f.q), 'tumor', 'schmorl.' + n, 'schmorl', { level: n })); anchors.set('schmorl.' + n, toW(f, 0.2, f.h / 2 - 0.3, -0.1)); });
  if (mods.burst) {
    const n = mods.burst, f = F[n], l = LV[n];
    const frag = toW(f, 0, f.h * 0.22, -fr_post(l, f) - 0.25);
    add(mergeGeoms([ellip(frag, 0.75, 0.42, 0.38, 14, f.q)]), 'boneHot', 'frag', 'frag', { level: n });
    anchors.set('frag', frag);
    [-0.8, 0.9].forEach((x, i) => add(new THREE.BoxGeometry(0.06, f.h * 1.05, l.D * 1.1).applyMatrix4(new THREE.Matrix4().makeRotationFromQuaternion(f.q)).translate(...toW(f, x, 0, 0).toArray()), 'lesion', 'crack.' + n, 'fxline', { level: n }));
  }
  function fr_post(l, f) { return f.Dw / 2 * 0.8; }
  if (mods.abscess) {
    const a = mods.abscess; const f = F[a.v];
    add(ellip(toW(f, a.x, a.y || 0, a.z || 0), a.rx, a.ry, a.rz, 18, f.q), 'abscess', 'abscess', 'abscess', { level: a.v });
    anchors.set('abscess', toW(f, a.x, a.y || 0, a.z || 0));
  }
  if (mods.myeloLesion) {
    const u0 = KI[mods.myeloLesion]; const smp = [];
    for (let u = u0 - 0.6; u <= u0 + 0.6; u += 0.1) { const s = spineAt(u); const [rx, rz] = cordR(u); smp.push({ c: s.p.clone().add(v(0, 0, s.zc).applyQuaternion(s.q)), q: s.q, rx: rx * 0.6, rz: rz * 0.75 }); }
    const rr = smp.map(o => { const r = []; for (let k = 0; k < 12; k++) { const t = 2 * Math.PI * k / 12; r.push(o.c.clone().add(v(Math.cos(t) * o.rx * 1.75, 0, Math.sin(t) * o.rz * 1.35).applyQuaternion(o.q))); } return r; });
    add(loft(rr, true, true), 'cordLesion', 'myelo.lesion', 'myelolesion', { level: null });
    anchors.set('myelo.lesion', SP(u0, 0, 0, spineAt(u0).zc));
  }
  if (mods.erosion) mods.erosion.forEach(([n, s]) => { const f = F[n], l = LV[n]; const c = toW(f, 0, s * (f.h / 2 - 0.2), 0); add(ellip(c, l.W * 0.36, 0.3, l.D * 0.34, 16, f.q), 'tumor', 'erosion.' + n, 'erosion', { level: n }); anchors.set('erosion.' + n, c); });

  /* ---- procedimentos: agulhas, contraste, ramo medial e radiofrequência, cimento, implantes ---- */
  // ponto: vetor, chave de âncora ('L1.ped.L') ou [quadro, x, y, z] no referencial de uma vértebra ou de um disco ('L4', 'L4-L5')
  const ptOf = a => a instanceof V3 ? a.clone() : typeof a === 'string' ? anchors.get(a).clone() : toW(F[a[0]] || discKF[a[0]], a[1], a[2], a[3]);
  // rotação do quadro de um ponto ou nome de quadro (para orientar gotas de contraste)
  const qOf = a => { const n = Array.isArray(a) ? a[0] : a, fr = typeof n === 'string' && (F[n] || discKF[n]); return fr ? fr.q : null; };
  const GAUGE = { 25: 0.026, 22: 0.036, 20: 0.045, 18: 0.064, 17: 0.074, 11: 0.15 }; // raio externo (cm) por calibre
  // agulha da pele (from) até a ponta (to), ou to + via (um ponto do trajeto) + len; ponta na cor de destaque, canhão do lado da pele
  // r: raio próprio (cânula de endoscopia); tipR/tipL: ponta romba e curta em vez do bisel fino
  const needle = o => {
    const to = ptOf(o.to), r = o.r || GAUGE[o.g || 22], k = o.key || 'needle';
    const from = o.from ? ptOf(o.from) : to.clone().add(new V3().subVectors(ptOf(o.via), to).setLength(o.len || 9));
    const d = new V3().subVectors(to, from).normalize(), neck = to.clone().addScaledVector(d, -(o.tipL || Math.max(0.3, 3 * r)));
    const ex = { level: o.level || (Array.isArray(o.to) ? o.to[0] : typeof o.to === 'string' ? o.to.split('.')[0] : null) };
    add(mergeGeoms([rod(from, neck, r, { seg: 10 }), rod(from.clone().addScaledVector(d, -1.1), from, Math.max(0.16, 2 * r), { seg: 12 })]), 'metal', k, o.info || 'needle', ex);
    add(rod(neck, to, r, { r2: r * (o.tipR || 0.3), seg: 10 }), 'needleTip', k, o.info || 'needle', ex);
    anchors.set(k, to.clone()); anchors.set(k + '.meio', from.clone().lerp(to, 0.5)); // ponta e meio do trajeto (fora do osso, para rótulo em corte)
  };
  // ramo medial do ramo dorsal (L1 a L4): sai da raiz, passa sobre a borda superior do transverso de baixo, na junção com o
  // processo articular superior, e desce para a faceta abaixo. shortcut: sem L5 (cruza a asa do sacro) e sem cervical ou torácica
  const MB = {};
  (mods.mbranch || []).forEach(n => {
    const Vn = 'L' + (+n.slice(1) + 1), f = F[Vn], l = LV[Vn];
    // rP: raio do pedículo do modelo; o transverso nasce dele, então a junção fica na borda de cima e de fora do pedículo
    const py = 0.12 * f.h, zP = -f.Dw / 2 - l.pl, rTP = Vn === 'L5' ? 0.52 : 0.4, rP = l.pw / 2 + 0.08, dx = rP - 0.115;
    [1, -1].forEach(s => {
      const side = s > 0 ? 'L' : 'R', L = (x, y, z) => toW(f, s * x, y, z);
      // direção da agulha da pele para a ponta: 15° de lateral para medial e 25° de caudal para cranial; o nervo corre paralelo a ela
      const d = v(-s * Math.sin(15 * deg) * Math.cos(25 * deg), Math.sin(25 * deg), Math.cos(15 * deg) * Math.cos(25 * deg)).applyQuaternion(f.q);
      const J = L(l.px + dx, py + Math.max(rTP, Math.sqrt(rP * rP - dx * dx)) + 0.1, zP + 0.18);
      const pts = [anchors.get(`root.${n}.${side}`), J.clone().addScaledVector(d, 1.1), J.clone().addScaledVector(d, 0.5), J, J.clone().addScaledVector(d, -0.6), L(l.px + dx + 0.3, py - 0.45, zP - 0.95), L(l.px + 0.55, py - 1.7, zP - 1.05)];
      add(tube(pts, () => 0.06, { N: 8 }), 'mbranch', `mb.${n}.${side}`, 'mbranch', { level: n });
      anchors.set(`mb.${n}.${side}`, pts[5]); // no trecho que desce, longe do rótulo da lesão
      MB[n + '.' + side] = { J, d, off: v(s, 0.2, -0.5).normalize().applyQuaternion(f.q), level: n };
      // alvo do bloqueio: ao lado do nervo, no osso da junção
      anchors.set(`mbt.${n}.${side}`, J.clone().addScaledVector(MB[n + '.' + side].off, 0.12));
    });
  });

  /* ---- ilíacos (mods.ilium): seções horizontais, de baixo para cima. A face medial é empurrada para fora do sacro até a
     folga da articulação sacroilíaca (0,22; 0,5 atrás, no espaço dos ligamentos interósseos) e a lateral sai dela pela
     espessura. Controles do lado esquerdo (x > 0), da borda posterior para a anterior, espelhados no direito ---- */
  const SIJ = {};
  if (mods.ilium) {
    const sg = loft(SAC.rr, true, true), spos = sg.attributes.position, sidx = sg.index, tris = [], qq = new V3();
    for (let t = 0; t < sidx.count; t += 3) { const T = new THREE.Triangle(...[0, 1, 2].map(k => new V3().fromBufferAttribute(spos, sidx.getX(t + k)))); T.box = new THREE.Box3().setFromPoints([T.a, T.b, T.c]); T.n = T.getNormal(new V3()); tris.push(T); }
    sg.dispose();
    const near = p => { let bd = 1e9, best = null; for (const T of tris) { if (T.box.distanceToPoint(p) ** 2 > bd) continue; T.closestPointToPoint(p, qq); const d = qq.distanceToSquared(p); if (d < bd) { bd = d; best = { q: qq.clone(), n: T.n }; } } return best; };
    // [y, 6 pontos (x, z) da face medial, 6 espessuras]
    const ROWS = [
      [-7.6, [7.2, -0.2, 7.4, 0.62, 7.6, 1.45, 7.8, 2.27, 8.0, 3.09, 8.2, 3.8], [0.4, 0.6, 0.8, 0.8, 0.6, 0.4]],
      [-7.2, [6.7, -1.4, 7.0, -0.16, 7.4, 1.18, 7.9, 2.63, 8.4, 3.97, 8.7, 5.0], [0.8, 1.3, 1.7, 1.7, 1.4, 0.9]],
      [-6.2, [5.9, -1.6, 6.3, -0.34, 6.9, 1.1, 7.7, 2.72, 8.5, 4.34, 9.0, 5.6], [1.0, 1.6, 2.0, 2.0, 1.6, 1.1]],
      [-5.0, [4.6, -3.6, 4.7, -2.4, 5.2, -1.02, 6.6, 1.01, 8.4, 3.59, 9.4, 5.9], [1.1, 1.8, 1.8, 1.4, 1.0, 1.0]],
      [-4.0, [3.4, -5.5, 3.6, -4.33, 4.0, -2.97, 6.0, 0.15, 8.4, 3.37, 9.6, 6.0], [1.4, 2.2, 2.0, 1.0, 0.8, 1.0]],
      [-2.9, [3.4, -4.9, 4.1, -3.36, 4.4, -1.83, 6.4, 1.15, 8.8, 4.41, 10.2, 7.0], [1.7, 2.6, 2.2, 0.8, 0.6, 0.9]],
      [-1.8, [3.7, -5.1, 4.6, -3.44, 4.9, -1.88, 6.8, 0.89, 9.2, 4.02, 10.9, 6.6], [1.8, 2.6, 2.2, 0.6, 0.5, 0.9]],
      [-0.8, [4.0, -4.8, 4.8, -2.67, 5.2, -1.12, 7.3, 1.69, 9.7, 4.69, 11.5, 7.6], [1.8, 2.4, 2.0, 0.5, 0.45, 0.9]],
      [0.0, [4.2, -4.6, 5.0, -3.0, 5.9, -1.0, 7.9, 1.7, 10.2, 4.8, 11.9, 7.9], [1.7, 2.0, 1.4, 0.4, 0.45, 1.0]],
      [1.0, [4.6, -4.4, 5.6, -2.95, 6.8, -1.12, 8.7, 1.4, 10.7, 4.2, 12.0, 7.0], [1.6, 1.6, 0.8, 0.4, 0.45, 1.0]],
      [2.6, [5.4, -3.9, 6.4, -2.7, 7.8, -1.13, 9.5, 0.9, 11.2, 3.2, 12.4, 5.6], [1.3, 1.2, 0.6, 0.45, 0.5, 0.9]],
      [4.2, [6.6, -2.6, 7.8, -1.81, 9.2, -0.69, 10.6, 0.66, 11.8, 2.17, 12.6, 3.6], [0.9, 0.9, 0.7, 0.6, 0.7, 0.8]],
      [5.1, [8.2, -1.2, 9.0, -0.7, 9.8, -0.07, 10.6, 0.55, 11.3, 1.18, 11.8, 1.8], [0.5, 0.6, 0.6, 0.6, 0.6, 0.5]],
      [5.45, [9.6, -0.6, 9.9, -0.35, 10.2, -0.1, 10.5, 0.15, 10.8, 0.4, 11.0, 0.6], [0.25, 0.25, 0.25, 0.25, 0.25, 0.25]]
    ];
    const ys = []; ROWS.forEach((r, i) => { if (i) { const y0 = ROWS[i - 1][0], n = Math.ceil((r[0] - y0) / 0.4); for (let k = 1; k < n; k++) ys.push(y0 + (r[0] - y0) * k / n); } ys.push(r[0]); });
    const M = 24;
    [1, -1].forEach(s => {
      const side = s > 0 ? 'L' : 'R';
      // folga: 0,22 na face lateral (articulação), 0,5 atrás (ligamentos interósseos)
      const push = p => {
        for (let it = 0; it < 6; it++) {
          const nr = near(p), sd = new V3().subVectors(p, nr.q).dot(nr.n), g = Math.abs(nr.n.x) > 0.6 ? 0.22 : 0.5;
          if (sd >= g - 1e-3) break;
          const h = v(nr.n.x, 0, nr.n.z); if (h.length() < 0.3) h.set(s, 0, 0);
          p.addScaledVector(h.normalize(), g - sd + 0.01);
        }
      };
      const smooth = a => { const c = a.map(p => p.clone()); for (let i = 1; i < a.length - 1; i++) a[i].copy(c[i - 1]).multiplyScalar(0.25).addScaledVector(c[i], 0.5).addScaledVector(c[i + 1], 0.25); };
      // 1) face medial de cada seção
      const secs = ys.map(y => {
        let i = 0; while (i < ROWS.length - 2 && ROWS[i + 1][0] < y) i++;
        const A = ROWS[i], B = ROWS[i + 1], f = Math.max(0, Math.min(1, (y - A[0]) / (B[0] - A[0])));
        const cp = [], tau = [];
        for (let k = 0; k < 6; k++) { cp.push(v(s * (A[1][2 * k] + (B[1][2 * k] - A[1][2 * k]) * f), y, A[1][2 * k + 1] + (B[1][2 * k + 1] - A[1][2 * k + 1]) * f)); tau.push(A[2][k] + (B[2][k] - A[2][k]) * f); }
        // na altura da articulação (S1 a S3) os controles 1 e 2 vão para dentro da face lateral do sacro (anéis 14 e 8 do lado):
        // o empurrão os devolve à folga e a face medial do ilíaco copia a do sacro
        const sl = i => { for (let j = 0; j < 5; j++) { const a = SAC.rr[j][i], b = SAC.rr[j + 1][i]; if ((a.y - y) * (b.y - y) <= 0 && a.y !== b.y) { const t = (y - a.y) / (b.y - a.y); return v(a.x + (b.x - a.x) * t, y, a.z + (b.z - a.z) * t); } } return null; };
        const wj = sm(-5.8, -4.3, y) * (1 - sm(-0.7, 0.3, y));
        if (wj > 0) [[1, 14], [2, 8]].forEach(([k, i]) => { const p = sl(s > 0 ? i : 44 - i); if (p) cp[k].lerp(p.add(v(-s * 0.3, 0, 0)), wj); });
        const m = new THREE.CatmullRomCurve3(cp, false, 'centripetal').getSpacedPoints(M - 1);
        // o empurrão deixa quinas: alisa e empurra de novo

        return { y, m, tau };
      });
      // 2) alisa entre as seções (mesmo índice), senão o fim da articulação vira degrau
      for (let k = 0; k < 2; k++) { for (let i2 = 0; i2 < M; i2++) smooth(secs.map(sc => sc.m[i2])); secs.forEach(sc => sc.m.forEach(push)); }
      // 3) face lateral: sai da medial pela espessura; alisada na seção e entre seções para não dobrar
      secs.forEach(sc => {
        const m = sc.m, tau = sc.tau;
        sc.lat = m.map((p, i2) => {
          const a = m[Math.max(0, i2 - 1)], b = m[Math.min(M - 1, i2 + 1)], n = v(s * (b.z - a.z), 0, -s * (b.x - a.x)).normalize();
          const u = i2 / (M - 1) * 5, k = Math.min(4, Math.floor(u));
          return p.clone().addScaledVector(n, tau[k] + (tau[k + 1] - tau[k]) * (u - k));
        });
        smooth(sc.lat); smooth(sc.lat);
      });
      for (let k = 0; k < 2; k++) for (let i2 = 0; i2 < M; i2++) smooth(secs.map(sc => sc.lat[i2]));
      const rings = secs.map(sc => sc.m.concat(sc.lat.slice().reverse()));
      secs.forEach(sc => { sc.pairs = sc.m.map(p => { const nr = near(p); return Math.abs(nr.n.x) > 0.6 && p.distanceTo(nr.q) < 0.3 ? [p, nr.q] : null; }); });
      add(loft(rings, true, true, 0, 0, true), 'bone', 'ilium.' + side, 'ilium', { level: null, region: 'S' });
      const at = y => secs.reduce((a, b) => Math.abs(b.y - y) < Math.abs(a.y - y) ? b : a);
      anchors.set('ilium.' + side, at(1.0).lat[14].clone());
      anchors.set('psis.' + side, at(-1.8).m[0].clone().lerp(at(-1.8).lat[0], 0.5));
      // articulação: meio da folga; .inf no terço inferior, na ponta de trás da articulação (por onde entra a agulha)
      const mids = sec => sec.pairs.filter(Boolean).map(([p, q]) => p.clone().lerp(q, 0.5));
      const mid = mids(at(-1.8)); anchors.set('sij.' + side, mid[Math.floor(mid.length / 2)]);
      // a agulha entra pela linha posterior, vinda de trás, um pouco de medial e de baixo (20° e 20°): assim cabe na fenda
      const tip = mids(at(-3.9))[0], a20 = 20 * deg;
      anchors.set('sij.' + side + '.inf', tip);
      anchors.set('sij.' + side + '.via', tip.clone().add(v(-s * Math.sin(a20) * Math.cos(a20), -Math.sin(a20), -Math.cos(a20) * Math.cos(a20)).multiplyScalar(9)));
      SIJ[side] = { secs, mids };
    });
  }

  /* ---- ramos laterais de S1 a S3 (mods.sacralLB: { side, lv, rf }): saem dos forames dorsais e correm para fora, sobre o dorso
     do sacro, até a linha posterior da articulação sacroilíaca; rf: lesões resfriadas em fileira na borda lateral dos forames ---- */
  const LBN = [];
  if (mods.sacralLB) {
    const o = mods.sacralLB, side = o.side, s = side === 'L' ? 1 : -1, xs = [1.95, 1.7, 1.4], LL = [2.0, 1.55, 1.15];
    const dors = (jf, x, off) => toW(SAC.SBi(jf), x, 0, SAC.backZ(jf, x) - off);
    o.lv.forEach(j => {
      const x0 = s * xs[j - 1], key = `lb.S${j}.${side}`, br = [];
      [[-0.14, 1], [0.3, 0.85]].forEach(([dj, fl]) => { const pts = []; for (let t = 0; t <= 1.001; t += 0.25) pts.push(dors(j + dj * t * t, x0 + s * (0.34 + LL[j - 1] * fl * t), 0.2)); br.push(tube(pts, () => 0.045, { N: 8 })); });
      add(mergeGeoms(br), 'mbranch', key, 'latbranch', { level: 'S' + j });
      anchors.set(key, dors(j + 0.05, x0 + s * (0.34 + LL[j - 1] * 0.5), 0.2));
      if (o.rf) {
        const pos = j < 3 ? [[-0.22, 0.6], [0, 0.72], [0.24, 0.6]] : [[-0.12, 0.62], [0.16, 0.62]];
        add(mergeGeoms(pos.map(([dj, dx]) => ellip(dors(j + dj, x0 + s * dx, 0.16), 0.4, 0.4, 0.4, 14))), 'rfLesion', `rfl.S${j}.${side}`, 'rflesion', { level: 'S' + j });
        anchors.set(`rfl.S${j}.${side}`, dors(j, x0 + s * 0.72, 0.16));
        // todas as agulhas na mesma direção: de trás, um pouco de baixo e de fora
        const tip = dors(j, x0 + s * 0.72, 0.02);
        LBN.push({ to: tip, via: tip.clone().add(v(s * 1.6, -2.4, -8.6)), g: 17, key: `rfs.S${j}.${side}`, level: 'S' + j, info: 'rfneedle' });
      }
    });
  }

  /* ---- cadeia simpática cervical (mods.cervSymp: 'R'): sobre o longo do pescoço, à frente dos transversos, com os gânglios
     cervical superior (C2-C3), médio (C6) e estrelado (C7-T1, à frente do colo da 1ª costela); e o tubérculo anterior de C6 ---- */
  if (mods.cervSymp) {
    const side = mods.cervSymp, s = side === 'L' ? 1 : -1;
    [1, -1].forEach(sg => {
      const P6 = VP.C6, sd = sg > 0 ? 'L' : 'R';
      add(ellip(toW(F.C6, sg * (P6.tfx + 0.55), -0.15, P6.tfz + 0.42), 0.24, 0.28, 0.22, 14, F.C6.q), 'bone', 'C6.at.' + sd, 'chassaignac', { level: 'C6', region: 'C' });
      anchors.set('C6.at.' + sd, toW(F.C6, sg * (P6.tfx + 0.55), -0.15, P6.tfz + 0.42));
      anchors.set('C6.at.' + sd + '.ant', toW(F.C6, sg * (P6.tfx + 0.5), -0.12, P6.tfz + 0.7));
    });
    const X = n => LV[n].W / 2;

  });
  // alteração de Modic (['L4-L5']): faixa de edema na medula óssea logo acima e logo abaixo do disco, junto às placas terminais
  (mods.modic || []).forEach(dn => {
    const [un, ln] = dn.split('-'); [[un, -1], [ln, 1]].forEach(([n, s]) => {
      const f = F[n], l = LV[n]; add(ellip(toW(f, 0, s * (f.h / 2 - 0.28), 0.05), l.W * 0.4, 0.2, f.Dw * 0.38, 18, f.q), 'modic', 'modic.' + n, 'modic', { level: n });
      anchors.set('modic.' + n, toW(f, l.W * 0.25, s * (f.h / 2 - 0.28), f.Dw * 0.2));
    });
  });
  // cimento ('L1'): massa irregular na metade anterior do corpo, abaixo da placa de cima já em cunha
  if (mods.cement) {
    const n = mods.cement, f = F[n], D = f.Dw, W = LV[n].W * md('widen', n, 1), z0 = 0.08 * D;
    const top = f.h / 2 - (z0 + D / 2) * Math.tan(f.w * deg), yc = (top - f.h / 2) / 2, ry = 0.68 * (top + f.h / 2) / 2;
    const g = new THREE.SphereGeometry(1, 28, 18), a = g.attributes.position;
    for (let i = 0; i < a.count; i++) { const x = a.getX(i), y = a.getY(i), z = a.getZ(i), q = 1 + 0.13 * Math.sin(5 * x + 1.3) * Math.sin(4 * y + 0.7) * Math.sin(4.5 * z + 2.1) + 0.06 * Math.sin(9 * x + 6 * z); a.setXYZ(i, x * q * 0.33 * W, yc + y * q * ry, z0 + z * q * 0.28 * D); }
    g.applyMatrix4(Msh(f)); g.computeVertexNormals();
    add(g, 'cement', 'cement', 'cement', { level: n });
    anchors.set('cement', toW(f, 0, yc, z0));
  }
  // cage em banana ({ at: 'L4-L5', side: 'L' }): arco na metade anterior do disco, de um lado ao outro, girado para o lado do acesso
  // bloco ({ at, shape: 'block', grow }): enxerto estrutural no meio do espaço desbridado, entrando grow em cada corpo (placas retiradas)
  if (mods.cage && mods.cage.shape === 'block') {
    const kf = discKF[mods.cage.at], K = KF[KI[mods.cage.at]], ol = bodyOutline(K.reg, K.W * 0.55, K.D * 0.55, 32), h = kf.th / 2 + (mods.cage.grow || 0);
    add(loft([[-h, 0.94], [-h + 0.1, 1], [h - 0.1, 1], [h, 0.94]].map(([y, s]) => ol.map(([x, z]) => toW(kf, x * s, y, 0.12 * K.D + z * s))), true, true), 'cage', 'cage', 'graft', { level: mods.cage.at });
    anchors.set('cage', toW(kf, 0, 0, 0.12 * K.D + 0.25 * K.D));
  } else if (mods.cage) {
    const kf = discKF[mods.cage.at], rot = (mods.cage.side === 'R' ? 15 : -15) * deg, pts = [];
    for (let a = -55; a <= 55; a += 11) { const t = a * deg, x = 1.5 * Math.sin(t), z = -0.55 + 1.5 * Math.cos(t); pts.push(toW(kf, x * Math.cos(rot) - z * Math.sin(rot), 0, x * Math.sin(rot) + z * Math.cos(rot))); }
    const up = v(0, 1, 0).applyQuaternion(kf.q);
    add(tube(pts, () => kf.th / 2 - 0.07, { N: 12, flat: 0.85, upFn: () => up }), 'cage', 'cage', 'cage', { level: mods.cage.at });
    anchors.set('cage', toW(kf, 0, 0, 0.9));
  }
  // parafusos pediculares ('L4.L'): pelo centro do pedículo, convergindo para medial, paralelos à placa terminal; haste liga as cabeças de cada lado
  const heads = { L: [], R: [] };
  (mods.screws || []).forEach(k => {
    const [n, side] = k.split('.'), s = side === 'L' ? 1 : -1, f = F[n], l = LV[n], D = f.Dw, zP = -D / 2 - l.pl, M = Msh(f), W = p => p.clone().applyMatrix4(M);
    const c = v(s * l.px, 0.12 * f.h, (-D / 2 + 0.35 + zP) / 2), a = (l.r === 'L' ? 5 + 3 * +n.slice(1) : 8) * deg, d = v(-s * Math.sin(a), 0, Math.cos(a));
    const e = c.clone().addScaledVector(d, (zP - 0.6 - c.z) / d.z), tip = c.clone().addScaledVector(d, (0.3 * D - c.z) / d.z);
    add(mergeGeoms([rod(W(e), W(tip), 0.3, { r2: 0.16, seg: 14 }), rod(W(e.clone().addScaledVector(d, 0.1)), W(e.clone().addScaledVector(d, -1.1)), 0.46, { seg: 14 })]), 'metal', `screw.${k}`, 'screw', { level: n });
    anchors.set(`screw.${k}`, W(c));
    heads[side].push([KI[n], W(e.clone().addScaledVector(d, -0.55))]);
  });
  Object.entries(heads).forEach(([side, hs]) => {
    if (hs.length < 2) return;
    hs.sort((a, b) => a[0] - b[0]);
    const a = hs[0][1], b = hs[hs.length - 1][1], u = new V3().subVectors(b, a).normalize();
    // mais de dois parafusos: haste moldada passando por todas as cabeças (lordose); com dois, reta
    const P = hs.map(h => h[1]), ua = new V3().subVectors(P[0], P[1]).normalize(), ub = new V3().subVectors(P[P.length - 1], P[P.length - 2]).normalize();
    add(hs.length > 2 ? tube([P[0].clone().addScaledVector(ua, 0.5), ...P, P[P.length - 1].clone().addScaledVector(ub, 0.5)], () => 0.28, { N: 14 }) : rod(a.clone().addScaledVector(u, -0.5), b.clone().addScaledVector(u, 0.5), 0.28), 'metal', 'rod.' + side, 'rod', { level: null });
    anchors.set('rod.' + side, a.clone().lerp(b, 0.5));
  });
  // artroplastia discal cervical ('C5-C6'): placa metálica com quilha encostada em cada placa terminal (quilha dentro do corpo)
  // e núcleo de polietileno entre elas; cada placa no quadro da vértebra dela, assim acompanha a placa terminal
  if (mods.adr) {
    const [un, ln] = mods.adr.split('-'), fu = F[un], fl = F[ln], ol = bodyOutline('C', 1.2, 1.1, 32), z0 = 0.07, parts = [];
    [[fu, -fu.h / 2 - 0.01, -1], [fl, fl.h / 2 + 0.01, 1]].forEach(([fr, y0, s]) => {
      const M = Msh(fr), y1 = y0 + s * 0.1;
      parts.push(loft([y0, y1].map(y => ol.map(([x, z]) => v(x, y, z + z0).applyMatrix4(M))), true, true));
      parts.push(new THREE.BoxGeometry(0.06, 0.22, 0.7).translate(0, y0 - s * 0.11, z0 + 0.1).applyMatrix4(M));
    });
    add(mergeGeoms(parts), 'implant', 'adr.plate', 'adrPlate', { level: mods.adr });
    const pu = toW(fu, 0, -fu.h / 2 - 0.11, z0), pl = toW(fl, 0, fl.h / 2 + 0.11, z0), c = pu.clone().lerp(pl, 0.5);

    anchors.set('adr', c); anchors.set('adr.core', toW(discKF[mods.adr], 0, 0, z0 + 0.3));
    anchors.set('adr.plate', toW(fu, 0, -fu.h / 2 - 0.05, z0 + 0.45)); anchors.set('adr.keel', toW(fu, 0, -fu.h / 2 + 0.15, z0 + 0.2));
    anchors.set('adr.ann', toW(discKF[mods.adr], 0, 0, -0.42 * KF[KI[mods.adr]].D)); // anel posterior que fica
  }

  // âncora de centros e metadados
  anchors.set('center', SP(KI.T10, 0, 0, 0));
  const kfy = KF.map(k => k.p.y);
  meshes.forEach(m => {
    if (m.userData.level) return;
    m.geometry.computeBoundingBox(); const b = m.geometry.boundingBox;
    let u0 = 1e9, u1 = -1e9; kfy.forEach((y, i) => { if (y >= b.min.y - 0.6 && y <= b.max.y + 0.6) { u0 = Math.min(u0, i); u1 = Math.max(u1, i); } });
    if (u0 <= u1) { m.userData.u0 = u0; m.userData.u1 = u1; }
  });
  return { root, reg, anchors, meshes, F, KI, spineAt, SP };
}

    evid: 'Como tratamento, a metilprednisolona intra-articular não superou o soro: 42% contra 33% relataram melhora acentuada em 1 mês, e só 22% contra 10% mantiveram a melhora até 6 meses, sem significância (Carette, NEJM 1991). Como teste, dos 176 pacientes 47% aliviaram com lidocaína, mas só 15% confirmaram com bupivacaína (Schwarzer, Pain 1994). A diretriz aceita um único bloqueio do ramo medial antes da radiofrequência; Bloqueios duplos elevam a taxa de sucesso da lesão, mas deixam de fora mais pacientes que responderiam a ela (Cohen, Reg Anesth Pain Med 2020).',
    pro: 'A injeção intra-articular com corticoide fica para dor facetária de perfil inflamatório ou quando a denervação é pouco indicada, e nesses casos também serve de bloqueio prognóstico (Cohen, Reg Anesth Pain Med 2020). O contraste vem antes do anestésico, porque 8% das injeções no ramo medial foram intravenosas e dariam falso-negativo (Dreyfuss, Spine 1997).'
  },
  {
    id: 'epidural', levels: ['L3', 'L4', 'L5', 'S'], cat: 0, name: 'Bloqueio epidural interlaminar e caudal', lv: 'L4-L5 interlaminar e hiato sacral',
    mods: { sacralCanal: true, needles: [{ to: ['L4-L5', 0, -0.4, -3.36], via: ['L4-L5', 0, -2.73, -12.05], g: 18, key: 'tuohy', info: 'tuohy', level: 'L4-L5' }, { to: ['S3', 0, 0, -1.45], via: ['S3', 0, -8.88, 0.24], key: 'needle.caudal', level: 'S3' }],
      contrast: [{ epi: ['L3-L4', 'L5-S1'], x: -0.45, w: 0.3, th: 0.06, key: 'contrast.epi', level: 'L4-L5' }, { path: ['needle.caudal', 'sacCanal.S2', 'sacCanal.S1'], r: 0.3, key: 'contrast.caudal', level: 'S' }] },
    cam: { t: 'sacCanal.S1', az: 90, el: 4, d: 34 }, show: 'bone disc lig neuro', clip: 'sag', ghost: true, focus: ['L2', 'L3', 'L4', 'L5', 'S', 'Co'], hot: [],
    labels: [['tuohy', 'Ponta no epidural posterior'], ['flav.L4-L5.R', 'Ligamento amarelo'], ['contrast.epi', 'Contraste no epidural posterior'], ['needle.caudal', 'Agulha no canal sacral'], ['hiatus', 'Hiato sacral'], ['contrast.caudal', 'Contraste subindo pelo canal'], ['dura', 'Saco dural']],
    regiao: 'Interlaminar na lombar, mais em L4-L5 e L5-S1, e na cervical baixa, de preferência em C7-T1 (Rathmell, Anesthesiology 2015); A caudal entra pelo hiato sacral e alcança L5-S1 e as raízes sacrais.', nao: 'Dor de uma só raiz, em um nível, em que se quer o fármaco na frente da raiz: a escolha é a transforaminal. Analgesia contínua por dias pede cateter peridural, e não injeção única.',
    ind: 'Dor radicular lombar por hérnia de disco ou estenose do canal que não cedeu com tratamento conservador, sobretudo quando a doença é central, bilateral ou de vários níveis. A via caudal serve quando o acesso interlaminar é difícil, como após laminectomia, e leva o fármaco aos níveis mais baixos, L5-S1 e raízes sacrais.',
    alvo: 'O espaço epidural posterior, entre o ligamento amarelo e a dura-máter. Na via interlaminar L4-L5 a agulha cruza pele, ligamentos supraespinhoso e interespinhoso e ligamento amarelo; Na via caudal entra pelo hiato sacral, fechado pelo ligamento sacrococcígeo, entre os cornos sacrais. O injetado tende a ficar atrás do saco dural e chega menos à interface disco-raiz, que fica na frente.',
    tec: 'Decúbito ventral, radioscopia e agulha de Tuohy, de ponta romba e curva, avançada na linha média ou paramediana até o ligamento amarelo. O espaço epidural é achado pela perda de resistência, quando a seringa com soro ou ar deixa de resistir ao passar o ligamento, e o contraste confirma a posição em AP e perfil. Na via caudal às cegas, a agulha ficou no lugar certo na primeira tentativa em 74,1% dos casos, o que justifica a radioscopia (Stitz, Spine 1999).',
    inj: 'Corticoide com anestésico local ou soro, em volume maior que na transforaminal, porque o fármaco precisa se espalhar até a raiz; No ensaio de Carette foram 80 mg de metilprednisolona em 8 mL (Carette, NEJM 1997). Na caudal o volume é ainda maior, para o injetado subir do sacro até L5-S1.',
    risco: 'A punção acidental da dura com agulha epidural ocorreu em 1,5% das peridurais obstétricas, e 52,1% delas evoluíram com cefaleia pós-punção, que piora em pé e melhora deitado (Choi, Can J Anaesth 2003). O hematoma epidural é raro, mas pode comprimir a cauda equina e exige atenção a anticoagulantes e antiagregantes; Também há infecção, injeção intravascular e, na caudal, injeção subcutânea ou intraóssea.',
    evid: 'Na ciática por hérnia, o corticoide epidural melhorou a dor na perna em 6 semanas, mas não a função, e não reduziu a cirurgia em 12 meses (25,8% contra 24,8%) (Carette, NEJM 1997). No WEST, o benefício apareceu só em 3 semanas, com melhora de 75% no Oswestry em 12,5% contra 3,7%, e sumiu de 6 a 52 semanas (Arden, Rheumatology 2005). Na estenose, corticoide com lidocaína não superou lidocaína isolada em 6 semanas, nem na via interlaminar nem na transforaminal (Friedly, NEJM 2014).',
    pro: 'Em hérnia L5-S1 com dor radicular, a via transforaminal deu alívio completo em 24 semanas a 9 de 30 pacientes, contra 3 de 30 na interlaminar e 1 de 30 na caudal, atribuído à chegada do corticoide ao espaço epidural anterior (Ackerman, Anesth Analg 2007). A perda de resistência com líquido reduziu a punção dural só em estudos não randomizados (Heesen, Minerva Anestesiol 2013).'
  },
  {
    id: 'siblk', levels: ['L5', 'S'], cat: 0, name: 'Bloqueio sacroilíaco', lv: 'Articulação sacroilíaca direita',
    mods: { ilium: true, needles: [{ to: 'sij.R.inf', via: 'sij.R.via', key: 'needle', level: 'S' }], contrast: [{ sij: 'R', y: [-4.4, -2.4], key: 'contrast.sij', level: 'S' }] },
    cam: { t: 'sij.R.inf', az: -150, el: 25, d: 28 }, show: 'bone', ghost: true, focus: ['L4', 'L5', 'S', 'Co'], hot: [],
    labels: [['sij.R', 'Articulação sacroilíaca'], ['needle', 'Ponta no terço inferior'], ['contrast.sij', 'Contraste dentro da articulação'], ['ilium.R', 'Ilíaco direito'], ['psis.R', 'Espinha ilíaca posterossuperior']],
    regiao: 'Articulação sacroilíaca, entre o sacro e o ilíaco, com a agulha no terço inferior da linha articular posterior, de um lado ou dos dois.', nao: 'Testes provocativos todos negativos ou dor acima de L5 de padrão facetário: o alvo provável é a faceta (bloqueio do ramo medial). Alívio curto após bloqueio positivo leva à RF sacroilíaca.',
    ind: 'Dor lombar baixa ou glútea abaixo de L5, às vezes irradiada para a virilha ou a coxa, com suspeita de origem sacroilíaca, e sacroileíte inflamatória que não cedeu ao tratamento clínico. Numa série com bloqueio, a articulação respondeu por 30% das dores lombares crônicas abaixo de L5-S1, e a dor na virilha foi o único padrão ligado à resposta (Schwarzer, Spine 1995); Entre os casos suspeitos pela clínica, a prevalência estimada é de 20% a 30% (Kennedy, Pain Med 2015).',
    alvo: 'A articulação sacroilíaca é sinovial na sua parte anterior e inferior, e a parte posterior e superior é ligamentar. O alvo é o terço inferior da linha articular posterior, a porta de entrada mais acessível da cavidade sinovial.',
    tec: 'Decúbito ventral e radioscopia, com o arco girado em oblíqua e inclinado em sentido caudal até separar as linhas anterior e posterior da articulação, e agulha fina no polo inferior. O contraste deve desenhar a fenda articular antes do anestésico. Às cegas, só 22% das injeções ficaram dentro da articulação, e 24% espalharam para o espaço epidural (Rosenberg, Clin J Pain 2000).',
    inj: 'No bloqueio diagnóstico, anestésico local em pequeno volume, para não vazar para as raízes sacrais ou o espaço epidural e gerar falso-positivo; Volumes baixos aumentam a especificidade do bloqueio sacroilíaco (Cohen, Reg Anesth Pain Med 2020). No bloqueio terapêutico, soma-se corticoide ao anestésico.',
    risco: 'Complicações graves são raras. O vazamento para fora da cápsula pode anestesiar raízes sacrais e explica a fraqueza ocasional na perna após a injeção (Rosenberg, Clin J Pain 2000); Há ainda reação vasovagal, injeção intravascular e infecção, como em qualquer punção articular.',
    evid: 'Nenhum teste isolado do exame prevê a resposta ao bloqueio, mas três ou mais de seis testes provocativos positivos tiveram sensibilidade de 94% e especificidade de 78% (Laslett, Man Ther 2005). A revisão sistemática achou evidência de qualidade moderada para o efeito terapêutico da injeção guiada (Kennedy, Pain Med 2015), e num ensaio duplo-cego em sacroileíte de espondiloartrite 5 de 6 articulações com corticoide tiveram mais de 70% de alívio em 1 mês, contra 0 de 7 com placebo (Maugars, Br J Rheumatol 1996).',
    pro: 'Quando nenhum dos seis testes provocativos reproduz a dor habitual, a sacroilíaca é praticamente afastada como fonte (Laslett, Man Ther 2005). O diagnóstico exige alívio alto em bloqueios comparativos com anestésicos de duração diferente (Kennedy, Pain Med 2015); Se o bloqueio é positivo e o alívio do corticoide é curto, a radiofrequência dos ramos laterais é o passo seguinte.'
  },
  {
