<style>
/* Painel do administrador: mesmo sistema do login (src/entrar.html). Quem pode ver os dados decide public.painel_admin() no Supabase. */
:root {
  --surface: #FFFFFF;
  --carbon: #171A20;
  --graphite: #393C41;
  --pewter: #5C5E62;
  --line: #D0D1D2;
  --f: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
body { margin: 0; background: var(--surface); color: var(--carbon); font-family: var(--f); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--carbon); outline-offset: 3px; }
[hidden] { display: none !important; }
header { height: 56px; box-sizing: border-box; padding: 0 48px; display: flex; align-items: center; justify-content: space-between; }
.logo { height: 22px; width: auto; display: block; }
header a { font-size: 14px; font-weight: 500; color: var(--pewter); text-decoration: none; padding: 12px 16px; border-radius: 4px; transition: color .33s; }
header a:hover { color: var(--carbon); }
main { max-width: 1440px; box-sizing: border-box; margin: 0 auto; padding: 56px 48px 64px; }
h1 { margin: 0; font-size: 40px; line-height: 48px; font-weight: 500; }
.lede { margin: 16px 0 0; font-size: 17px; line-height: 26px; color: var(--graphite); }
.lede a { color: var(--carbon); text-underline-offset: 3px; }
.resumo { margin: 40px 0 0; display: flex; flex-wrap: wrap; gap: 16px 56px; }
.resumo dt { font-size: 14px; line-height: 20px; color: var(--pewter); }
.resumo dd { margin: 4px 0 0; font-size: 28px; line-height: 34px; font-weight: 500; font-variant-numeric: tabular-nums; }
.tabela { margin-top: 48px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px; font-variant-numeric: tabular-nums; }
caption { position: sticky; left: 0; max-width: calc(100vw - 32px); text-align: left; padding-bottom: 12px; font-size: 17px; line-height: 26px; font-weight: 500; }
th, td { text-align: left; vertical-align: top; padding: 12px 16px 12px 0; border-bottom: 1px solid var(--line); }
thead th { font-weight: 500; color: var(--pewter); }
tbody th { font-weight: 500; }
tbody th span { display: block; font-weight: 400; color: var(--graphite); }
td { color: var(--graphite); white-space: nowrap; }
td.w { white-space: normal; } /* datas quebram linha para a tabela caber em 1440 px */
@media (max-width: 700px) {
  header { padding: 0 16px; }
  .logo { height: 18px; }
  header a { padding: 12px 8px; }
  main { padding: 32px 16px 48px; }
  h1 { font-size: 28px; line-height: 34px; }
  .lede { font-size: 16px; line-height: 24px; }
  .resumo { gap: 16px 32px; }
  .resumo dd { font-size: 24px; line-height: 30px; }
  .tabela { margin-top: 32px; }
}
</style>
